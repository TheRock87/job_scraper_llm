ty and security.\n* Design, develop, and maintain reusable AI agents and apps that automate or augment high\\-value innovation workflows (e.g., discovery and search, concept creation, etc.).\n* Partner with Experimentation Labs \\& Coaches to implement successful\/high high\\-potential agents and tools\n* Build and Scale Best Practices\n* Coordinate best practice development and knowledge sharing across innovation use cases and leads\n* Maintain and refresh the AI innovation Playbook, including prompt engineering, evaluation, guardrails, and coding standards.\n* Facilitate peer\\-led learning moments and internal showcases to build a collective skillset\n* Lead Vendor Diligence and Scan for Opportunities\n* Lead vendor diligence and manage onboarding processes, including coordination with Legal, Sourcing, and IT\n* Proactively scan internal and external ecosystems (startups, academia, peers) to identify promising tools, capabilities, and partners\n* Negotiate technical scopes and evaluation criteria to accelerate pilot\u2011to\u2011scale transitions.\n\n\n**Key Behaviors**\n* Learning Curiosity \u2013 Self\\-directed in exploring emerging research, tools, and best practices; proactively shares takeaways to upskill peers.\n* Adaptive Mindset \u2013\u202fComfortably adjusts priorities and approaches as project goals, data, or business context evolve.\n* Builder Mindset \u2013 Breaks complex problems into testable components; writes clean, well\u2011documented code, and automates repeatable tasks\n* Agility in Execution \u2013\u202fMoves quickly from insight to action, learn fast, and pivots when needed.\n* Resilience \\& Grit \u2013\u202fMaintains momentum through setbacks, viewing failures as data points that refine the next hypothesis.\n\n\n**Minimum Qualifications**\n* Bachelor\u2019s degree in computer science, Data Science, Engineering, OR another degree with demonstrated coding and gen AI experience.\n* Experience in building AI\u2011powered applications, agents, or workflows. Expertise in AI agent frameworks (LangChain, AutoGen, CrewAI) and Retrieval\u2011Augmented Generation (RAG) patterns.\n* Proficiency in Python (preferred) or TypeScript\/JavaScript, version control (Git), and cloud services (e.g., GCP, AWS, Azure).\n* Hands\\-on experience integrating LLM APIs and vector store\n\n\n**Preferred Qualifications**\n* Experience working in the CPG, Food, and Consumer Product industry\n* Experience working in product innovation and commercialization\n* Background or education in Psychology\n\n\n**Additional Considerations**\n* This role is remote eligible and will consider candidates throughout the domestic United States. International relocation or international remote work arrangements (outside of the US) will not be considered.\n* Applicants for this position must be currently authorized to work in the United States on a full\\-time basis, and General Mills will not sponsor applicants for this position for work visas.\n\n\n**Salary Range**\n The salary range for this position is $108900\\.00 \\- $163500\\.00 \/ Annually. At General Mills we strive for each employee's pay at any point in their career to reflect their experiences performance and skills for their current role. The salary range for this role represents the numerous factors considered in the hiring decisions including, but not limited to, educations, skills, work experience, certifications, etc. As such, pay for the successful candidate(s) could fall anywhere within the stated range. Beyond base salary, General Mills offers a competitive Total Rewards package focusing on your overall well\\-being. We are proud to offer a foundation of health benefits, retirement and financial wellbeing, time off programs, wellbeing support and perks. Benefits may vary by role, country, region, union status, and other employment status factors. You may also be eligible to participate in an annual incentive program. An incentive award, if any, depends on various factors, inclu apacities and help us address real world client problems . We currently have a particular focus on language\\-based Generative AI, and therefore we are looking for someone with knowledge and experience in this space. Specifically, we need someone to help with the entire AI capability lifecycle, i.e., identify relevant new AI capabilities, present ideas to the product team, facilitate internal learning \/ understanding, contribute to the product roadmap, prototype these capabilities, and spec, develop, and maintain production\\-level AI features (in collaboration with software engineers and the wider product team).\n \n\n\n\n  \n\n\n\n\n\n This person will collaborate with consultants, engineers, designers, product specialists, and sales people to take solutions from ideation through deployment to value!\n \n\n\n\n  \n\n\n\n\n\n This opportunity is for an AI Engineer who is happy to work either remote or hybrid in London as part of a remote\\-first, highly collaborative, fast moving, tech scale\\-up.\n \n\n\n\n  \n\n\n\n\n\n**What you\u2019ll do** \n\n\n\n* Stay at the forefront of Generative AI capabilities, and identify those relevant to our product, WorkflowGPT, and based on real client use cases.\n* Prototype new Generative AI capabilities, and present relevant new capabilities to the wider team for consideration in the product roadmap\n* Spec, develop, and maintain production\\-level Generative AI features (in collaboration with software engineers)\n* Facilitate internal learning \/ understanding so that the wider team (from engineering to sales) understand the new Generative AI capabilities\n* Support sales, by demonstrating solutions to client use cases based on existing WorkflowGPT capabilities\n* Contribute to the continuous improvement of AI innovation and delivery capacities within the organisation.\n* Work remotely as part of a remote\\-first startup, actively engaging in a highly collaborative and fast\\-moving environment.\n\n\n\n  \n\n\n\n\n\n**Skills, Experience, and Mindset** \n\n\n\n\n*An ideal candidate would have most of these,* \n\n\n\n* Proficient in researching, prototyping, and implementing algorithms (AI or otherwise)\n* Proficient Python programming skills\n* Experience working in an engineer software engineering team\n* Strong interest in Generative AI\n* Good knowledge and experience in Generative AI concepts (e.g. prompt engineering, RAG, agents, fine\\-tuning, etc), and tools (e.g. LangChain, LangSmith, LangGraph, etc)\n* Well\\-rounded ML knowledge (i.e. not just generative AI)\n* Proficiency in data science tools and techniques, e.g. numpy, Pandas, scikit\\-learn, notebooks, streamlit, etc\n* Experience using Microsoft Azure\n* Strong interpersonal and communication skills in English, both written and verbal\n* Experience working in a fast\\-moving product company\n* Experience with Data Engineering tools \\& techniques, e.g. Databricks, Spark, Azure Data Factory, Kafka, etc, and distributed systems in general\n* BSc\/MSc in Computer Science, Physics, Mathematics, Engineering, or similar field\n* Passionate about technology, product, user experience and building high quality solutions.\n* Collaborative mindset with the ability to work effectively with consultants, engineers, designers, and product specialists.\n\n\n\n  \n\n\n\n\n\n*At Curvestone we don\u2019t just accept differences,\u00a0we celebrate it, we support it, and we thrive on it for the benefit of our employees, our clients and our services. We are an equal opportunity employer and all qualified applicants will receive equal consideration for employment without regard to age, ancestry, colour, family or medical care leave, gender identity or expression, marital status, national origin, physical or mental disability, race, religion, sexual orientation, or any other characteristic protected by applicable laws, regulations and ordinances. We also consider qualified applicants regardless of criminal histories, consistent with legal requirements. If you need assistance and\/or reasonable adjustments due to a disability during the application or interview process please let us know and we will be pleased to assist.*","company_industry":"Software Development","company_url":"https:\/\/uk.linkedin.com\/company\/curvestone","company_logo":"https:\/\/media.licdn.com\/dms\/image\/v2\/C4E0BAQG7pia91lY9iA\/company-logo_100_100\/company-logo_100_100\/0\/1631332770553?e=2147483647&v=beta&t=rXnVKmQKmjmmBuQnN5ooT7Gbn9ArSUzU5LLC_U7jqEk","company_url_direct":null,"company_addresses":null,"company_num_employees":null,"company_revenue":null,"company_description":null,"skills":null,"experience_range":null,"company_rating":null,"company_reviews_count":null,"vacancy_count":null,"work_from_home_type":null,"search_term":"Ai engineer","search_location":"London, UK","job_hash":"b394de9aeb32cbebee55f6bafe787268","Is_Junior_AI_Job":"Uncertain","Country":"UK"},{"id":"li-4265898854","site":"linkedin","job_url":"https:\/\/www.linkedin.com\/jobs\/view\/4265898854","job_url_direct":"https:\/\/www.ycombinator.com\/companies\/asteroid\/jobs\/HmxKL3n-founding-ai-engineer?utm_source=syn_li&urlHash=W-IZ","title":"Founding AI Engineer","company":"Asteroid (YC W25)","location":"London, England, UK","date_posted":null,"job_type":"fulltime","salary_source":null,"interval":null,"min_amount":null,"max_amount":null,"currency":null,"is_remote":false,"job_level":"mid-senior level","job_function":"Engineering and Information Technology","listing_type":null,"emails":null,"description":"Asteroid is building mission control for AI agents, enabling any company to easily onboard AI browser workers. We\u2019re starting by building browser agents that automate complex browser tasks like form filling and data retrieval, with a focus on reliability and security.\n   \n\n  \n\n We have the opportunity to free humans from tedious, repetitive computer\\-based labor, empowering them to focus on more meaningful work. Your mission as our Founding AI Engineer is idates. If you want an accommodation\/adjustment for a disability or any other reason during the hiring process, please send a request to your recruiting partner.\n   \n\n  \n\n We are an equal\\-opportunity employer and celebrate diversity, recognizing that diversity builds stronger teams. We approach diversity and inclusion seriously and thoughtfully. We do not discriminate on the basis of race, religion, color, ancestry, national origin, caste, sex, sexual orientation, gender, gender identity or expression, age, disability, medical condition, pregnancy, genetic makeup, marital status, or military service.\n   \n\n  \n\n Job is open for no less than 7 days and will be removed when the position is filled.","company_industry":"Entertainment Providers","company_url":"https:\/\/www.linkedin.com\/company\/netflix","company_logo":"https:\/\/media.licdn.com\/dms\/image\/v2\/D4E0BAQGMva5_E8pUjw\/company-logo_100_100\/company-logo_100_100\/0\/1736276678240\/netflix_logo?e=2147483647&v=beta&t=OSlCcMLJmlXo79qPS59zP_IX873LK5R4FGYeUAWXdiQ","company_url_direct":null,"company_addresses":null,"company_num_employees":null,"company_revenue":null,"company_description":null,"skills":null,"experience_range":null,"company_rating":null,"company_reviews_count":null,"vacancy_count":null,"work_from_home_type":null,"search_term":"Machine learning engineer","search_location":"Dubai, UAE","job_hash":"24e0ad0a066fccee1e88892e01557ffe","Is_Junior_AI_Job":"Yes","Country":"UAE"},{"id":"li-4192772885","site":"linkedin","job_url":"https:\/\/www.linkedin.com\/jobs\/view\/4192772885","job_url_direct":"https:\/\/app.greenhouse.io\/embed\/job_app?token=6709289&gh_src=8c01b2f01&source=LinkedIn&urlHash=sxPx","title":"Machine Learning Engineer","company":"Upstart","location":null,"date_posted":null,"job_type":"fulltime","salary_source":"description","interval":"yearly","min_amount":123200.0,"max_amount":170500.0,"currency":"USD","is_remote":true,"job_level":"associate","job_function":"Engineering and Info ers, fostering a culture of technical excellence.\n* Collaborate with product managers, data scientists, and software engineers to define project requirements and deliver solutions.\n* Stay up\\-to\\-date with the latest advancements in machine learning and artificial intelligence, and apply them to relevant projects.\n* Contribute to the development of best practices and standards for machine learning development.\n* Present technical findings and recommendations to stakeholders at all levels.\n* Design and implement model monitoring and retraining strategies.\n* Lead the investigation and resolution of complex technical issues related to machine learning systems.\n\n\n**About You**\n You are a seasoned machine learning engineer with a passion for pushing the boundaries of AI. You thrive in a fast\\-paced, collaborative environment and are eager to tackle complex challenges. You possess a deep understanding of machine learning principles and a proven track record of building and deploying impactful solutions. You are an effective leader, eager to mentor and guide others, and you are driven by a desire to innovate and make a significant contribution to the field. You are not only a skilled engineer but also a strategic problem solver, able to translate business needs into technical solutions. You are a lifelong learner, always seeking to expand your knowledge and stay ahead of the curve in the rapidly evolving world of machine learning.\n   \n\n  \n\n**Required Qualifications:**\n* Master\u2019s or Ph.D. in Computer Science, Machine Learning, Artificial Intelligence, or a related field.\n* 10\\+ years of professional experience in machine learning engineering.\n* 6\\+ years experience in designing and implementing large\\-scale machine learning systems in production environments.\n* 6\\+ years experience in Python, with expertise in machine learning libraries such as TensorFlow, PyTorch, scikit\\-learn, and others.\n* 6\\+ years experience with cloud platforms (e.g. m what types of commercial problems analytical techniques can help solve to in\\-depth technical training for specific types of analysis.\n   \n\n  \n\n We are actively looking for a Data Scientist to join L.E.K.\u2019s rapidly growing Data \\& Analytics team. The primary focus of this role is to provide technical expertise: helping to execute on complex analytics across a wide variety of often fast\\-paced client engagements, helping to build innovative tools and applications that can help solve client\u2019s commercial issues, helping to execute cutting edge analytical techniques, helping to drive technical roadmaps for the function and firm, and training our colleagues.\n   \n\n  \n\n As part of a dynamic and growing team, there is every opportunity to carve out value added work, and to grow your skills and experience. You receive state\\-of\\-the\\-art training in a variety of domains and lead the organization to adopting new and innovative methods to solve our clients\u2019 hardest questions. You won\u2019t just be a technical expert: you will intersect between data science, and commercial business understanding, across a variety of domains to provide analytically driven recommendations to our clients.\n   \n\n  \n\n Data \\& Analytics is one of four key pillars to the Solutions Team at L.E.K. Consulting, alongside Market Insights, Information \\& Research Center and Knowledge Management. The Solutions team works together to support and enable our consulting team members to generate best in class insights for our clients.\n   \n\n  \n\n**Responsibilities**\n Client engagements:\n   \n\n  \n\n* Support end\\-to\\-end data science projects from conceptualization through to deployment, and deploy advanced machine learning models in clients' cloud environments, optimizing for scalability, performance, and reliability to address specific business challenges and objectives\n* Support clients in strategically leveraging technical models, guiding them through the interpretation of results and the integration of actionable insights into their business workflows.\n* Solve a wide variety of complex analytical challenges for clients, sometimes dynamically balancing multiple client engagements at one time\n* Analytical needs can include: data aggregation \/ creation, data cleaning \/ manipulation, commercial data science (e.g., geospatial, machine learning, predictive modelling, NLP, GenAI etc.), and visualizations\n* Help drive the technical roadmap needed to support client engagements\n\n\n**Analytical Apps, Service Lines, And Proprietary Data Assets**\n* Drive the development of state\\-of\\-the\\-art analytical apps, leveraging up\\-to\\-date in machine learning algorithms to solve complex problems\n* Collaborate with a variety of stakeholders to continuously innovate on the apps, service lines and proprietary data assets we can offer\n* Provide technical expertise and thought leadership on developing analytical tools, services lines, and proprietary data assets, and contribute to building these areas directly when applicable\n* Uphold best\\-in\\-class standards in app development, data integrity, and ensuring solutions are both scalable and maintainable\n\n\n**Client \/ Business Development**\n* When relevant, support Managing Directors in developing and delivering client proposals where advanced data and analytics are critical to the scope of work\n* Provide input into training \/ upskilling the D\\&A team provides to Managing Directors to ensure they are aware of all of our most current capabilities\n\n\n**Capability Development**\n* Stay up to date on best\\-in\\-class software, tools, and techniques to ensure that we are able to provide clients with best\\-in\\-class solutions\n* Support commercialization and upskilling of staff on relevant software, tools and techniques\n* Help drive the technical roadmap to ensure we are operating a best\\-in\\-class Data \\& Analytics function\n\n\n  \n\n  \n\n**Qualifications And Experie ield applications and analyze results.\n* Design and implement machine learning algorithms and models for predictive analysis.\n* Manage the full lifecycle of data science applications from conceptualization to product development.\n* Present data analysis results effectively to non\\-technical stakeholders.\n* Stay updated on industry trends and advancements in data science and machine learning.\n\n\n**Qualifications:**\n* PhD degree or a Master\u2019s degree with at least 2 years of experience in a science or engineering technical field.\n* Strong coding skills in R or Python, with a focus on data preparation, regression, and visualization.\n* Formal education in statistics, including regression analysis and hypothesis testing.\n* Solid background in machine learning and deep learning techniques, particularly in clustering, classification, and supervised learning methodologies (e.g., random forest, xgboost).\n* Proficiency in working with large language models (LLMs) and experience in developing Generative AI technologies.\n* Familiarity with Natural Language Processing (NLP), ontology, knowledge graphs, and advanced retrieval techniques.\n* Experience in SQL database queries and data visualization tools (e.g., PowerBI).\n* Ability to autonomously develop algorithms and applications using data science tools including data wrangling, clustering, outlier removal, predictive modeling, optimization, and time series forecasting.\n* Excellent self\\-learning abilities with a keen interest in keeping abreast of industry advances.\n* Strong interpersonal and communication skills to convey complex technical concepts to diverse audiences.\n\n\n Join our Talent Community to stay connected with us!\n   \n\n  \n\n On May 22, 2024, we announced a plan to separate our Electronics and Water businesses in a tax\\-free manner to its shareholders. On January 15, 2025, we announced that we are targeting November 1, 2025, for the completion of the intended separation of the Electronic rt and enable our consulting team members to generate best in class insights for our clients.\n   \n\n  \n\n**Responsibilities**\n Client engagements:\n   \n\n  \n\n* Support end\\-to\\-end data science projects from conceptualization through to deployment, and deploy advanced machine learning models in clients' cloud environments, optimizing for scalability, performance, and reliability to address specific business challenges and objectives\n* Support clients in strategically leveraging technical models, guiding them through the interpretation of results and the integration of actionable insights into their business workflows.\n* Solve a wide variety of complex analytical challenges for clients, sometimes dynamically balancing multiple client engagements at one time\n* Analytical needs can include: data aggregation \/ creation, data cleaning \/ manipulation, commercial data science (e.g., geospatial, machine learning, predictive modelling, NLP, GenAI etc.), and visualizations\n* Help drive the technical roadmap needed to support client engagements\n\n\n**Analytical Apps, Service Lines, And Proprietary Data Assets**\n* Drive the development of state\\-of\\-the\\-art analytical apps, leveraging up\\-to\\-date in machine learning algorithms to solve complex problems\n* Collaborate with a variety of stakeholders to continuously innovate on the apps, service lines and proprietary data assets we can offer\n* Provide technical expertise and thought leadership on developing analytical tools, services lines, and proprietary data assets, and contribute to building these areas directly when applicable\n* Uphold best\\-in\\-class standards in app development, data integrity, and ensuring solutions are both scalable and maintainable\n\n\n**Client \/ Business Development**\n* When relevant, support Managing Directors in developing and delivering client proposals where advanced data and analytics are critical to the scope of work\n* Provide input into training \/ upskilling the D g!\n \n\n\n\n  \n\n\n\n\n\n Denn als eines der f\u00fchrenden Unternehmen unserer Branche im Bereich Digitales Marketing bilden Daten die Basis f\u00fcr all unsere Entscheidungen. Um unser starkes Wachstum weiter voranzutreiben, suchen wir ab sofort f\u00fcr unser Data \/ BI Team einen Senior Data Analyst (w\/m\/d). Schenke mit uns durch Deine Arbeit Millionen von Menschen ein l\u00e4ngeres und ges\u00fcnderes Leben!\n \n\n\n\n  \n\n\n\n\n\n**DEINE AUFGABEN** \n\n\n\n\n  \n\n\n\n\n* Als Senior Data Scientist treibst Du spannende und herausfordernde Advanced\\-Analytics\\-Projekte im Online Marketing voran.\n* Mit statistischen Modellen lieferst Du datengetriebene Insights und somit wertvollen Input f\u00fcr die Ausrichtung unserer Marketing\\-Kampagnen.\n* In enger Abstimmung mit dem Top\\-Management entwickelst Du Dashboards, Visualisierungen und Ad\\-Hoc\\-Analysen zu Business\\-relevanten Fragestellungen.\n* Du pflegst und erweiterst nach Bedarf unsere Online\\-Marketing\\- und eCommerce\\-Datenbank sowie relevante Schnittstellen.\n* Du sorgst f\u00fcr eine exzellente Datenqualit\u00e4t und dokumentierst Datenquellen bzw. Workflows.\n\n\n\n \u00ad\n \n\n\n\n**DEIN PROFIL** \n\n\n\n\n  \n\n\n\n\n* Du hast Dein Studium in Mathematik, Statistik, (Wirtschafts\\-) Informatik, Data Science, Marketing, Betriebswirtschaftslehre oder einem \u00e4hnlichen Studiengang erfolgreich abgeschlossen. Alternativ kannst Du eine exzellent abgeschlossene Ausbildung im IT\\-Bereich aufweisen.\n* Du verf\u00fcgst \u00fcber mehrj\u00e4hrige Berufserfahrung in einem herausfordernden Umfeld im Bereich der Datenpflege, \\-aufbereitung bzw. \\-analyse.\n* Du besitzt ausgepr\u00e4gte analytische und konzeptionelle F\u00e4higkeiten und \u00fcberzeugst Durch Deine strukturierte Arbeitsweise.\n* Du lebst die Hands\\-on Mentalit\u00e4t, auch bei der Verwendung neuer Tools und Anwendungen.\n* Du verf\u00fcgst \u00fcber eine schnelle Auffassungsgabe, ein hohes Ma\u00df an Eigeninitiative sowie eine Leidenschaft f\u00fcr Zahlen und Daten.\n* Du beherrschst mindestens eine Programmiersprache wie Python oder Java, hast bereits erfolgreich mit SQL\\-Datenbanken gearbeitet und erste Erfahrungen mit Cloud\\-Plattformen wie AWS, Azure oder Google Cloud gesammelt.\n* Du kennst Dich mit Datenverarbeitungstools wie Alteryx, Adverity oder vergleichbaren Tools, sowie mit BI\\-Software wie z.B. Tableau, Power BI oder Google Data Studio aus.\n* Du hattest in Deiner Berufslaufbahn Ber\u00fchrungspunkte mit (Online\\-)Marketing\\- und\/oder BI\\-Teams\n* Du bringst Dich aktiv ins Team ein und treibst Deine Themenbereiche eigenst\u00e4ndig, zuverl\u00e4ssig und proaktiv voran.\n* Du bringst verhandlungssichere Deutsch\\- oder Englischkenntnisse (C1\\-Level) mit.\n\n\n\n  \n\n\n\n\n\n**\u00dcBER UNS** \n\n\n\n\n  \n\n\n\n\n\n**Kijimea \u2013 Aus der Forschung. F\u00fcr Dein Leben.** \n Seit unserer Gr\u00fcndung im Jahr 2011 verfolgen wir eine klare Vision: Wir m\u00f6chten das Potenzial der Mikrobiota (Bakterien) in unserem Darm gezielt nutzen f\u00fcr ein l\u00e4ngeres und ges\u00fcnderes Leben \\- f\u00fcr alle Menschen.\n \n\n\n\n  \n\n\n\n\n\n Ein erster gro\u00dfer Meilenstein auf diesem Weg gelang uns bereits 2013 mit der Entdeckung und klinischen Erforschung des einzigartigen Bakterienstamms\n *B. bifidum* \n MIMBb75 (\n **Kijimea Reizdarm** \n ). Seitdem konnten wir das Leben von Millionen Reizdarmpatienten weltweit sp\u00fcrbar verbessern. Heute geh\u00f6rt\n *B. bifidum* \n MIMBb75 zu den am besten erforschten Bakterienst\u00e4mmen weltweit. Seine Wirksamkeit und sein einzigartiger Wirkmechanismus wurden in zahlreichen klinischen Studien nachgewiesen und publiziert \u2013 u.a. in renommierten Fachzeitschriften wie\n **The Lancet** \n .\n \n\n\n\n  \n\n\n\n\n\n Wir arbeiten mit f\u00fchrenden Forschungsinstitutionen wie der Charit\u00e9 Berlin zusammen, um die Zusammenh\u00e4nge zwischen der Mikrobiota (Bakterien in unserem Darm) und Allergien, Hautkrankheiten und psychischen St\u00f6rungen zu erforschen. Kurz gesagt: Wir untersuchen, wie die Bakterien in unserem Darm Einfluss auf ein l\u00e4ngeres und ges\u00fcnderes Leben nehmen.\n \n\n\n\n  \n\n\n\n\n\n Heute z\u00e4hlen wir zu den am schnellsten wachsenden Healthcare\\-Unternehmen weltweit. Unsere Kunden erreichen wir \u00fcber verschiedenste Kan\u00e4le: \u00fcber die direkte Kommunikation mit \u00c4rzten und Apothekern sowie Print\\-, TV\\- und Digitalmarketing. Um unser stark wachsendes Gesch\u00e4ft in Europa weiter auszubauen, suchen wir einen\n **Senior Data Analyst (Online Marketing),** \n der uns bei dieser Mission unterst\u00fctzt Unser Ziel ist klar definiert: Bis 2028 wollen wir Kijimea zur weltweit gr\u00f6\u00dften DTC\\-Probiotikamarke machen und damit j\u00e4hrlich \u00fcber 50 Millionen Menschen ein besseres Leben schenken.\n \n\n\n\n  \n\n\n\n\n\n  \n\n\n\n\n\n**UNSER VERSPRECHEN** \n\n\n\n\n  \n\n\n\n\n\n Wir bieten Dir einen vielf\u00e4ltigen, anspruchsvollen Job mit spannenden Aufgaben und einem breiten Spektrum an Gestaltungsm\u00f6glichkeiten! Unser innovatives Umfeld erm\u00f6glicht Dir Deine berufliche Entfaltung mit kurzen Entscheidungswegen, Verantwortung von Tag 1 an und den Freiraum, neue Wege zu gehen. Auf Dich wartet individuelles Learning und echte Sinnhaftigkeit \u2013 schenke mit Deinem pers\u00f6nlichen Beitrag Millionen von Menschen ein neues Leben!\n \n\n\n\n  \n\n\n\n\n\n  \n\n\n\n\n\n*\\*Aus Gr\u00fcnden der besseren Lesbarkeit wird in dieser Anzeige die m\u00e4nnliche Form verwendet. Sie bezieht sich ausdr\u00fccklich auf alle Geschlechter (w\/m\/d).*","company_industry":"Pharmaceutical Manufacturing and Biotechnology Research","company_url":"https:\/\/de.linkedin.com\/company\/synformulas","company_logo":"https:\/\/media.licdn.com\/dms\/image\/v2\/D4D0BAQHBso7_7DucJg\/company-logo_100_100\/B4DZb4c9ccHsAU-\/0\/1747925064117\/synformulas_logo?e=2147483647&v=beta&t=c5Ada1UEYDrDNRzEY8WhgQ1CW7k4n5JtFVzKftuFpPs","company_url_direct":null," ollaboration and innovation are at the heart of what we do, and we are always looking for individuals who can contribute their unique perspectives and talents to help us stay ahead in a constantly evolving industry.  \n\n  \n\n**About the Role**  \n\nFollowing the recent acquisition of a high\\-potential affiliate website in the iGaming sector, we are looking for a driven SEO Manager to take complete ownership of this asset. Your mission will be to architect and execute the strategy that unlocks its full growth potential.  \n\nThe ideal candidate is a hands\\-on SEO expert, deeply skilled in technical optimisation, on\\-page strategy, and link building. You will work closely with our development team to coordinate site improvements, take the lead on writing and editing authoritative content, train up colleagues to help with all aspects of the business, and call in freelancers if needed.  \n\nThis is a foundational role with a significant opportunity for growth. We are committed to expanding this area of our business, and we are looking for an entrepreneurial person to help build, lead, and shape the future.### **Key Responsibilities**\n\n  \n\n* Drive SEO strategy by conducting in\\-depth technical audits, keyword research, site architecture reviews, and competitor analysis.\n* Collaborate proactively with the product team to resolve technical SEO issues and optimise conversion\\-focused user journeys.\n* Own the entire content production lifecycle, from planning and creation to ensuring every piece is optimised for search intent.\n* Direct and manage external resources, including agencies and freelancers, and lead hiring for new team members as required.\n* Help deliver clear and actionable performance reports to senior management, highlighting key metrics, progress, and strategic recommendations.\n* Develop and execute a high\\-impact link\\-building strategy.\n* Mentor colleagues to build team\\-wide SEO expertise.\n\n  \n\n### **Skills, Knowledge and Expertise** nd software engineers constantly striving to refine our world class statistical models while also researching and deploying new ones.  \n\n  \n\nOur work bridges three domains, each challenging in its own right \\- iGaming, quantitative research and software development. This convergence demands a rare blend of skills and creativity to identify and capitalise on inefficiencies across the iGaming landscape. The opportunities are vast, but we are only as good as the people we bring on board.  \n\n  \n\nAs a startup, we offer a dynamic and entrepreneurial environment where you\u2019ll work on impactful projects and have the autonomy to explore new ideas. In\\-person collaboration and innovation are at the heart of what we do, and we are always looking for individuals who can contribute their unique perspectives and talents to help us stay ahead in a constantly evolving industry.  \n\n  \n\nAt White Swan Data, we recognise that building a diverse and inclusive workforce within a highly technical field presents both opportunities and challenges. We recognise the value that a variety of perspectives can bring to innovation, problem\\-solving, and business success. A team composed of individuals from different backgrounds, experiences, and ways of thinking fosters creativity, enhances decision\\-making, and ultimately strengthens our ability to tackle complex challenges.","company_industry":null,"company_url":"https:\/\/uk.indeed.com\/cmp\/White-Swan-Data","company_logo":null,"company_url_direct":null,"company_addresses":null,"company_num_employees":null,"company_revenue":null,"company_description":null,"skills":null,"experience_range":null,"company_rating":null,"company_reviews_count":null,"vacancy_count":null,"work_from_home_type":null,"search_term":"Data scientist","search_location":"London, UK","job_hash":"e342cc01baf4750fcaa9347099fe667d","Is_Junior_AI_Job":"No","Country":"UK"},{"id":"in-8ce87b04e2c29392","site":"indeed","job_url":"https:\/\/uk.indeed.com\/viewjob?jk=8ce87b04e2c29392","job_url_direct":"https:\/\/apply.workable.com\/j\/E4CA18274A","title":"Forward Deployed Data Engineer","company":"SIGNAL","location":"London, ENG, GB","date_posted":"2025-07-14","job_type":"fulltime","salary_source":null,"interval":null,"min_amount":null,"max_amount":null,"currency":null,"is_remote":true,"job_level":null,"job_function":null,"listing_type":null,"emails":null,"description":"### **About Signal Ocean:**\n\nSignal Ocean is the technology arm of the Signal Group. Our primary product, The Signal Ocean Platform, helps shipping and commodities professionals navigate their complex decision making. Driven by advanced machine learning and artificial intelligence, our technology suite provides tailored, exclusive insights that support our clients in achieving performance and efficiency. By securely handling and combining private and public shipping data flows, and applying advanced analytics, insights are delivered over web and mobile applications, as well as through a rich set of APIs and SDKs. Our backend architecture is abstracted to modularly offer deep analytics capabilities that are leveraged in the solutions that we offer or can be directly embedded in our client\u2019s system topologies.\n\n### **Summary**\n\n\nSignal is looking for a Forward Deployed Data Engineer to join our high\\-growth team. This is not your typical data role\u2014you\u2019ll sit at the crossroads of data, engineering, technical pre\\-sales, and product design, working side\\-by\\-side with commercial teams and enterprise clients to design, prototype, and deliver scalable data solutions that drive adoption and revenue.\n\n### **What You\u2019ll Do:**\n\n\nClient\\-Centric Data Solutions\n\n* Collaborate with clients, sales, and account teams to uncover real\\-world data needs and friction points.\n* Build working data products\u2014from custom Python pipelines and enriched datasets to Power BI templates and Snowflake\\-ready views.\n* Support pre\\- and post\\-sales with prototypes, demos, onboarding materials, and technical discovery.\n* Act as a trusted technical advisor, helping clients see the value in Signal\u2019s unique data assets.\n\nForward Engineering \\& Product Innovation\n\n* Prototype new data delivery interfaces (APIs, data warehouses, SDKs, BI integrations).\n* Co\\-create new metrics and models (e.g., congestion scores, freight indices) with data scientists.\n* Test experimental APIs with design partners and shape future productization plans.\n\nAPI Optimization \\& Documentation\n\n* Shape how Signal\u2019s data is accessed and delivered (batch vs real\\-time, API vs warehouse).\n* Own external\\-facing documentation\u2014making it clear, modern, and actionable for all audiences.\n* Improve SDKs and onboarding materials; remove outdated examples and create client\\-relevant ones.\n\nUsage Intelligence \\& Feedback Loops\n\n* Track client usage across APIs and data products; uncover what\u2019s working and what needs improvement.\n* Reframe underused assets for higher impact and increased adoption.\n\nFeed real client metrics back into engineering and product roadmaps.\n\n **Requirements**\n\n### **What You Bring:**\n\n* 5\\+ years in data\\-heavy roles (e.g., Data Engineer, Data Analyst, Sata Scientist, API developer, etc.)\n* Strong command of Python, SQL, and API schemas\u2014and the ability to explain them clearly.\n* Deep experience building or deploying data products in commercial settings.\n* Strong business acumen; you get how data is used, not just how it\u2019s built.\n* Passion for working directly with clients and solving complex, high\\-value problems.\n* Comfortable operating across both technical and commercial teams.\n* Experience in cloud infrastructure, software engineering, or analytics frameworks a plus.\n* A curious mind\u2014especially if you\u2019re excited to learn about industries like shipping and commodities trading.\n\n**Benefits**\n\n### **What We Offer:**\n\n* Generous compensa n":"**Join a digital first bank that\u2019s powered by people.**\n\n  \n\nAre you looking for an opportunity to advance your tech career? Interested in creating next\\-generation cybersecurity and analytics capabilities? If you are, then apply to join HSBC\u2019s Cybersecurity Science \\& Analytics (CSA) team. We use our award\\-winning advanced analytics platform to develop innovative products for securing one of the largest technology estates in the world.\n\n  \n\n\n\nCSA are a unique and multi\\-skilled team of cybersecurity scientists, data and analytics professionals, and engineers. Our mission is to harness the power of data, analytics, AI\/ML, and cybersecurity science to innovate and advance HSBC\u2019s cybersecurity capabilities.\n\n  \n\nThe Principal Engineer \\- Cybersecurity Analytics is the most senior hands\\-on engineer within the team and will work across all CSA\u2019s delivery teams (particularly CSA\u2019s Advanced Projects team), joining a global group of cybersecurity specialists, data scientists, and software engineers from diverse backgrounds to deliver critical analytics engineering requirements for Cybersecurity teams.\n\n  \n\n\n\nThis is a critical technical role, leading the technical strategy and delivery of advanced analytics solutions to cybersecurity problems through rapid development of prototypes, engineering of production solutions, and exploration of longer term, potentially ground\\-breaking technologies. The successful candidate will be involved in ongoing personal, hands\\-on software engineering activity as well as oversight of technical strategy and engineering practice.\n\n  \n\nPrincipal Accountabilities:\n\n* Software Engineering\n\t+ Developing custom security applications, APIs, and data\\-driven services in support of the Cybersecurity mission\n\t+ Design, build, deliver, and maintain multiple Cybersecurity analytic and machine learning pipelines and applications in the cloud\n\t+ Researching new tech \/ processes and being the driving force to adopt them\n\t+ Thinking a few steps ahead of the technology advancement curve and guiding the team in promising new directions\n\t+ Contributing to architecture by asking the right questions to ensure architecture matches business needs for the area\n\t+ Ensuring CSA has appropriately high technical competence and strives for excellence, mentoring junior members of the team on best practices and aiming to help improve the team\u2019s overall performance\n\t+ Jumping in to help debug and triage critical systems as needed\n* Data Engineering\n\t+ Designing and building custom applications, platforms and solutions to tackle cybersecurity challenges.\n\t+ Ingestion and provisioning of datasets, delta tables, and curated, re\\-usable data assets to enable Cybersecurity use cases.\n\t+ Providing thought leadership and best practice to the wider engineering community in CSA and across the Cybersecurity teams.\n\t+ Supporting and developing more junior engineers.\n* Cybersecurity Sciences Research \\& Development (R\\&D) and Innovation\n\t+ Driving innovative research \\& development to test and evolve new technologies and advanced analytic techniques.\n\t+ Exploring and developing innovative capabilities, exploiting emerging technologies and data science to help stay ahead of advancing cyber threats.\n* Rapid Response\n\t+ Responding to urgent requests to address vulnerabilities or emerging threats.\n* Advanced Analytics \\& Security Software Development\n\t+ Supporting Cybersecurity teams in using data and advanced analytic technologies effectively to enhance operations and inform decisions.\n\t+ Delivering critical analytics engineering requirements across Cybersecurity.\n\t+ Developing new data products, analysis platforms, and custom AI solutions to enable Cybersecurity teams to monitor controls more effectively, automatically detect and triage malicious activity, optimise manual tasks, better protect HSBC, and meet the needs of customers.\ osure to business planning, pricing, or commercial decision\\-making; experience with forecasting, scenario, and financial modelling (including partnering with Finance and Commercial teams and their models (in Excel, Google Sheets))\n* Familiarity with geospatial data\n* Experience in fast\\-scaling startups or operational teams\n\n\n We're flexible on experience \u2013 if you\u2019re an experienced and pragmatic data scientist, with a track record of driving impact, we\u2019d love to hear from you.\n   \n\n  \n\n**What We Offer**\n* Generous equity package\n* 25 days annual leave, plus bank holidays\n* Bupa Global Business Premier health plan \u2013 including mental, dental, and optical cover\n* Enhanced Parental Leave:\n+ 20 weeks of fully paid maternity leave\n+ 4 weeks of fully paid paternity leave\n\n* Contributory pension scheme\n* Friday office lunches\n* Access to cutting\\-edge AI tooling\n* Hybrid working from our dog\\-friendly Shoreditch office\n* Free gym membership via our co\\-working spaces\n* Cycle\\-to\\-work scheme\n* Regular team socials, events, and offsites!!","company_industry":"Consumer Services","company_url":"https:\/\/uk.linkedin.com\/company\/relay-tech","company_logo":"https:\/\/media.licdn.com\/dms\/image\/v2\/C4E0BAQEad5MBIWDOSQ\/company-logo_100_100\/company-logo_100_100\/0\/1676309932536\/relay_tech_logo?e=2147483647&v=beta&t=Fq54KSVVkGYO7d4ihwVlxehMZKaafzt7SVyvDIC02cg","company_url_direct":null,"company_addresses":null,"company_num_employees":null,"company_revenue":null,"company_description":null,"skills":null,"experience_range":null,"company_rating":null,"company_reviews_count":null,"vacancy_count":null,"work_from_home_type":null,"search_term":"Data scientist","search_location":"London, UK","job_hash":"76b726b5e59c2b13d80d8d73bbfd4402","Is_Junior_AI_Job":"Yes","Country":"UK"},{"id":"li-4236581463","site":"linkedin","job_url":"https:\/\/www.linkedin.com\/jobs\/view\/4236581463","job_url_direct":"https:\/\/wmg.wd1.myworkdayjobs.com\/ s of the data team, fostering a culture of learning and development in advanced analytical techniques.\n* Stay at the forefront of industry trends, emerging technologies, and best practices in data science and machine learning, evaluating their potential application within our business.\n\n\n**About You**\n**DATA SCIENCE**\n* Extensive proficiency in Python and its associated data science libraries (e.g., Pandas, NumPy, scikit\\-learn, TensorFlow, PyTorch) and data visualisation libraries (e.g., Plotly, Dash).\n* Strong knowledge and practical application of statistical analysis and data visualization techniques.\n* Strong experience of a wide range of machine learning algorithms, including supervised \\& unsupervised.\n* Proven experience in machine learning model interpretation and evaluation with the ability to articulate model limitations and risks.\n\n\n**DATA ENGINEERING**\n* Significant experience with data extraction, transformation and processing large\\-scale datasets.\n* Advanced proficiency in SQL for complex data extraction, manipulation and optimization.\n* Demonstrable experience designing, building, and maintaining robust and scalable ETL processes and data pipelines for datasets from various sources (website scraping, social media APIs, internal systems).\n* Experience with Docker and other relevant tools for deploying and scaling data pipelines and machine learning models is a strong advantage.\n\n\n**Additional Technical Skills**\n* Experience with Python web development frameworks \u2013 Django, in particular, beneficial.\n* Experience with Git for version control and collaborative development.\n* Familiarity with Snowflake or Databricks, especially with Snowpark or PySpark Python libraries.\n* Experience with big data technologies and cloud platforms (e.g., AWS, Azure) a benefit.\n* Familiarity and practical experience with time series modelling techniques are a benefit.\n\n\n**Leadership \\& Soft Skills**\n* Exceptional problem\\-solving and cr e as we shape the future of health for patients, our communities, and our people. If you want to be part of tomorrow\u2019s health today, we want to hear from you.\n   \n\n  \n\n**Job Summary**\n We are seeking a highly skilled and motivated data scientist with a strong background in Real\\-world Data (RWD) analytics. The ideal candidate will have expertise in programming for the analysis of large datasets and a proven track record of research in healthcare. You will collaborate with colleagues across McKesson\u2019s business, data, and technology teams, to provide analytical support and methodological expertise for Real\\-World Evidence (RWE) studies, generation of input parameters for health economic models, and exploratory RWE requests from cross\\-functional stakeholders.\n   \n\n  \n\n**Specific Responsibilities**\n You will independently and collaboratively plan, perform, and communicate the following outcomes research support activities:\n   \n\n  \n\n* Develop Statistical Analysis Plans (SAPs) and\/or table shells as part of study protocol development\n* Explore the suitability of datasets (internal or external) for addressing outcomes research questions\n* Assist in RWE analytics activities, including writing detailed documentation, reviewing, running, and validating analyses in SAS, R, and\/or SQL\n* Propose methodologies, data sources, and process improvements, leveraging your understanding of the RWD ecosystem and your machine learning and statistical expertise.\n* This role requires the ability to analyze complex data sets, develop algorithms, and create innovative solutions to enhance our data\\-driven decision\\-making processes.\n\n\n**General Responsibilities**\n* Collaborate: Partner with team members and lead analytics segments of RWD and RWE projects, utilizing PSP, pharmacy, clinic, claims, and other data sets\n* Data Analysis: Analyze and interpret large RWD databases\n* Develop and Review Specifications: Collaborate and communicate effectively els below.","company_industry":"Utilities","company_url":"https:\/\/au.linkedin.com\/company\/australian-energy-market-operator","company_logo":"https:\/\/media.licdn.com\/dms\/image\/v2\/C560BAQHFesLLk1oylg\/company-logo_100_100\/company-logo_100_100\/0\/1644282071614\/australian_energy_market_operator_logo?e=2147483647&v=beta&t=Cxob53ZtrXy7fLN4ZTH9q254thNiT_zr3Bi_nzSveCg","company_url_direct":null,"company_addresses":null,"company_num_employees":null,"company_revenue":null,"company_description":null,"skills":null,"experience_range":null,"company_rating":null,"company_reviews_count":null,"vacancy_count":null,"work_from_home_type":null,"search_term":"Data scientist","search_location":"Perth, Australia","job_hash":"3199948a85bab0f7eebbc5dd7fd0247c","Is_Junior_AI_Job":"Uncertain","Country":"Australia"},{"id":"in-f5d3ce87dd166461","site":"indeed","job_url":"https:\/\/au.indeed.com\/viewjob?jk=f5d3ce87dd166461","job_url_direct":"https:\/\/career10.successfactors.com\/career?career%5fns=job%5flisting&company=DoIT&navBarLevel=JOB%5fSEARCH&rcm%5fsite%5flocale=en%5fGB&career_job_req_id=46878&selected_lang=en_GB&jobAlertController_jobAlertId=&jobAlertController_jobAlertName=&browserTimeZone=Europe\/Kiev&_s.crb=5F8X%2f5zB5DfsxbhtNAl7KLKhVqAIkH%2fcngnOY5bT0c4%3d","title":"EL2 - Director, Road Safety Data Hub and Analysis","company":"Australian Department of Infrastructure and Regional Development","location":"Canberra, ACT, AU","date_posted":"2025-07-13","job_type":"parttime, fulltime","salary_source":null,"interval":null,"min_amount":null,"max_amount":null,"currency":null,"is_remote":true,"job_level":null,"job_function":null,"listing_type":null,"emails":"Cianain@infrastructure.gov.au, recruitment@infrastructure.gov.au, DiversityandInclusion@infrastructure.gov.au","description":"**\\[\\[title]]**\n\n  \n\n\n\n **Title:**\n\n  \n\n\n Director\n\n  \n\n\n **Classification(s):**\n\n  \n\n\n \\[\\[newsingclass]]\n\n  \n\n\n **Employment Type:**\n\n  \n\n\n \\[\\[filter2]], \\[\\[filter3]]\n\n  \n\n\n **Salary:**\n\n  \n\n\n \\[\\[filter4]] \\- \\[\\[filter5]] per annum plus 15\\.4% superannuation\n\n  \n\n\n **Business Division:**\n\n  \n\n\n \\[\\[division]]\n\n  \n\n\n **Branch \/ Section:**\n\n  \n\n\n \\[\\[department]], \\[\\[location]]\n\n  \n\n\n **Location:**\n\n  \n\n\n \\[\\[mfield2]]\n\n  \n\n\n\n We want to recruit the best people to our department. Our roles support flexible work arrangements including the opportunity to work from home and from one of our departmental offices. Our preference is for candidates to be located in Canberra. For more information on the operational needs or inherent requirements of the role please contact the contact officer listed below.\n\n  \n\n\n **Security Clearance:**\n\n  \n\n\n \\[\\[securitylevel]]\n\n  \n\n\n **Job Reference No:**\n\n  \n\n\n \\[\\[id]]\n\n  \n\n\n **Contact Officer:**\n\n  \n\n\n \\[\\[hiringManagerName]] on 02 6136 6285 or Georgia.O'Cianain@infrastructure.gov.au\n\n  \n\n\n **Closing Date:**\n\n  \n\n\n**11\\.59pm AEST, Sunday 10 August 2025**\n\n  \n\n\n***T******he department supports workplace diversity and values the contribution of people from diverse backgrounds. We encourage applications from Aboriginal and\/or Torres Strait Islander peoples, people with disability, people with cultural and linguistic diversity, and LGBTQIA\\+ people. The department is committed to achieving gender equality and, in particular, supporting women\u2019s progression into senior leadership.***\n=========================================================================================================================================================================================================================================================================================================================================================================================================================================\n\n  \n\n\n**The opportunity we have available**\n\n  \n\n\n\nThe Data, Research, Strategy \\& Net Zero Division strives to strengthen the Department\u2019s strategic policy capabilities. The Division\u2019s work assists in portfolio policy development, long\\-term economic research and analytical support, and data collection, management and dissemination.\n\n  \n\n\n\n\nThe Bureau of Infrastructure and Transport Research Economics (BITRE) and Bureau of Communications and Regional Research (BCARR), provide statistics, research and analysis to support evidence based policy, program development and regulation, and to stimulate informed discussion and debate on issues critical to the portfolio. The Bureaux are staffed by talented data scientists, engineers, analysts and researchers who examine critical issues impacting the vibrant and diverse portfolio sectors, and collect and manage unique road, aviation, maritime, and rail transport data collections which are made available as open data, statistical publications, research reports, dashboards and interactive maps. As a Director in the Bureaux, you will work closely with divisions within the department.\n\n  \n\n\n\n\nAs part of the Bureaux leadership team, you will work across the department, levels of government, industry and the community and contribute to the department\u2019s research and data capability to provide data, analysis and advice on emerging and priority issues, including those relating to First Nations outcomes.\n\n  \n\n\n\nAs a Director in the Bureaux, you can expect to:\n\n\n* Lead and continuously build a dynamic and diverse team, as well as manage complex internal and external stakeholder relationships\n* Provide clear strategic direction, monitor and ensure progress towards goals, and manage risk\n* Increase data transparency, accessibility, and quality, including provide leadership and change management to improve the efficiency and reliability of data processing with new technology\n* Enable and encourage collaboration among government, industry, research and community stakeholders\n* Undertake and support research and develop new and improved data or statistical collection\n\n  \n\n\n**What will you do ?**\n\n  \n\n\n**Director, Road Safety Data Hub and Analysis**\n\n\n\nWe are looking for a high performing and dynamic director to lead the Road Safety Data and Analysis team.\n\n  \n\n\n\n\nDay to day your role will be a mix of fast paced and more strategic work, and include a variety of responsibilities, from managing quick turn around and often high profile requests from Ministers or their offices, media teams and line areas, to clearing regular publications for accuracy and clarity, and improving the efficiency and currency of systems. You and your team will also be working close with lines areas to advise on data sources and develop presentations for road safety initiatives. You will be coaching and managing staff, as well as strategic planning and contributing directly to capability uplift in strategy, research and data fields across the branch, division, and department.\n\n  \n\n\n\nThe Director of Road Safety Data and Analysis is responsible for:\n\n\n* Leading a multi\\-disciplinary team in a hybrid work environment to oversee the production of high quality road safety related databases and regular statistical products including publications, dashboards and research. This includes continuous improvement of content and presentation to ensure products are meeting the information needs of stakeholders, and continuous improvement of the data management practices and systems used to collect and generate reports to take advantage of new technology and be more accurate and efficient.\n* Providing leadership to the team managing and upgrading the Road Safety Data Hub website, the Road Safety Data Sharing Agreement, and national progress reporting for the Road Safety Strategy.\n* Maintaining and growing key strategic relationships with stakeholders, including the Road Safety Data Working Group, other external road safety data owners and researchers, and policy areas within the department.\n* Undertaking complex and sometime urgent analysis of road safety statistics and applying significant judgement and understanding of the road safety, road investment, and wider departmental policy environment, in applying the analysis to policy questions and reports.\n* Working closely with line areas and executive to provide strategic advice, problem solving and risk and issues management using road safety statistics and data to support the work of department policy teams and external bodies.\n\n  \n\n\n**Who are we looking for?**\n\n  \n\n\n\nThe successful candidate for this position will be able to demonstrate their capability against the Executive level 2 Work level standards.\n\n  \n\n\n\nWe are looking for leaders who are focused on achieving positive outcomes and have a track record in people management. Experience or a strong interest in managing change, leading practice data management, as well as collaboration and stakeholder engagement would be advantageous. Specifically, we are seeking candidates who can:\n\n\n* **Actively lead and collaborate** \u2013lead a high performing team for the delivery of outcomes, and provide successful technical and general problem solving, progress tracking and issues management. Demonstrate collaboration, communication, and interpersonal skills that build relationships based on understanding, respect, and trust with different types of people at different levels in an organisation \u2013 valuing different perspectives, contributions and backgrounds.\n* **Achieve results** and quality outcomes by showing initiative and leadership, providing technical and general leadership to a small to medium sized team, delivering multiple technical and non\\-technical activities at any given time, often within tight timeframes.\n* **Communicate effectively** \u2013 written and verbal and visual communication (including complex technical and statistical charts, maps and diagrams) \u2013 delivering clear information in a variety of formats that is persuasive and influential for a wide range of audiences.\n* **Think strategically** \\- evaluate complex information from a variety of sources to make connections and sound decisions while exercising good judgement and managing risk.\n* **Have a growth mindset** \u2013 demonstrate an ongoing commitment to personal growth, learning and development, and foster an environment for team members to do the same.\n* **Effectively analyse and manage data** drawn from a range of sources using a variety of analytical and statistical software tools.\n\n  \n\n\n\nThe positions would suit individuals with educational qualifications in a field of social science or science, such as economics, data science, computer science, mathematics, statistics, urban planning, demography, geography or a related field.\n\n  \n\n\n\n\n\n**RecruitAbility minimum requirements**\n\n  \n\n\n\nMinimum requirements for this role include:\n\n\n* **Actively lead and collaborate** \u2013lead a high performing team for the delivery of outcomes, and provide successful technical and general problem solving, progress tracking and issues management. Demonstrate collaboration, communication, and interpersonal skills that build relationships based on understanding, respect, and trust with different types of people at different levels in an organisation \u2013 valuing different perspectives, contributions and backgrounds.perspectives, contributions and backgrounds.\n* **Achieve results** and quality outcomes by showing initiative and leadership, providing technical and general leadership to a small to medium sized team, delivering multiple technical and non\\-technical activities at any given time, often within tight timeframes.\n* **Communicate effectively** \u2013 written and verbal and visual communication (including complex technical and statistical charts, maps and diagrams) \u2013 delivering clear information in a variety of formats that is persuasive and influential for a wide range of audiences.\n* **Think strategically** \\- evaluate complex information from a variety of sources to make connections and sound decisions while exercising good judgement and managing risk.\n* **Have a growth mindset** \u2013 demonstrate an ongoing commitment to personal growth, learning and development, and foster an environment for team members to do the same.\n* **Effectively analyse and manage data** drawn from a range of sources using a variety of analytical and statistical software tools.\n\n  \n\n\n\nJob applicants with disability who met the requirements are advanced to the next stage of the selection process:\n\n\n* Opt into the scheme\n* Declare they have a disability, and\n* Meet the minimum requirements of a vacancy advertised in the scheme\n\n  \n\n\n\nMore information can be found at RecruitAbility scheme: A guide for applicants \\| Australian Public Service Commission.\n\n **What else can we offer?**\n\n  \n\n\n\nWe are dedicated to fostering personal and professional development, empowering individuals to set goals, acquire new skills, and cultivate unique qualities that define who they are. We believe that this not only leads to a more fulfilling and happier life but also enhances the overall quality of our work. Some of the benefits we offer include:\n\n\n* Access to our study Assistance Program that provides paid leave and financial support for you to undertake courses of study that contribute to the improvements of your professional skills and knowledge relevant to our work and broader Australian Public Service.\n* Through our investment in learning and development opportunities, and a positive performance culture, we provide diverse career pathways for our people to enable their mobility and adapt in a rapidly changing world.\n* Improve your leadership skills, through the department\u2019s Professional Coaching Scheme and tailored leadership opportunities for staff members.\n* Flexible working oppor nd relevant frameworks.\n* Extract, transform, and load (ETL) data from various sources (databases, APIs, etc.)\n* Clean, transform, and prepare data for analysis using Python and relevant libraries.\n* Build, test, and deploy supervised ML models for classification, prediction, and regression tasks.\n* Apply unsupervised techniques such as clustering for pattern recognition and data exploration.\n* Design and optimise MLOps and LLMOps workflows to streamline deployment and monitoring of models.\n* Leverage Generative AI and Retrieval\\-Augmented Generation (RAG) frameworks for advanced NLP and language model applications.\n* Work with Neo4j and other modern platforms to analyse graph\\-based relationships and networks.\n* Create impactful visualisations using Tableau or Power BI to present insights to stakeholders.\n* Collaborate with cross\\-functional teams including data engineering, solution architecture, project management and business development.\n* Stay ahead of the curve by researching emerging technologies and tools in the data science and Gen AI space.\n* Effectively communicate complex data findings and recommendations to technical and non\\-technical audiences.\n\n\n\n  \n\n\n\n\n\n**About You:** \n\n\n\n* You will possess a structured approach, analytical prowess, and impeccable data science skills.\n* A structured thinker with a passion for turning data into actionable insights.\n* Master\u2019s degree in Statistics, Computer Science, Mathematics, or a related field.\n* 2\\+ years of hands\\-on experience in a data science or applied ML role.\n* Strong skills in Python (and optionally R), with experience using libraries like scikit\\-learn, TensorFlow, PyTorch, or AutoML tools.\n* Practical understanding or experience with Retrieval\\-Augmented Generation (RAG) and Gen AI concepts.\n* Experience working with cloud platforms such as AWS, Azure, Snowflake, and Neo4j.\n* Familiarity with MLOps and LLMOps frameworks, CI\/CD pipelines for model deployment and monitoring.\n* Proficient in using Tableau or Power BI to create dashboards and reports.\n* Experience with notebook environments such as Jupyter Notebook, RStudio, or Databricks.\n* Strong communication skills and ability to translate complex technical concepts to non\\-technical audiences.\n* Open to feedback, collaborative in nature, and passionate about continuous learning.\n\n\n\n  \n\n\n\n\n\n**Here\u2019s a Taste of What\u2019s on Offer at dataengine:** \n\n\n\n* Opportunity to solve real\\-world business problems.\n* Collaborative and supportive work environment.\n* Competitive salary.\n* Be at the forefront of data science innovation in a dynamic startup environment.\n* Work on a variety of challenging and impactful projects across different industries.\n* Opportunity to learn and grow your skillset with the latest technologies.\n* Continuous learning and development opportunities.\n* Weekly fresh fruit, snacks, monthly industry led lunches and active staff activities.\n* Be part of a company that is shaping the future of data\\-driven solutions.\n\n\n\n  \n\n\n\n\n\n**Please note this role can be based in either Auckland or Wellington.** \n\n\n\n\n  \n\n\n\n\n\n**If you are a passionate and talented data scientist \/ MLOps Engineer who is excited about making a real impact, we encourage you to apply!**","company_industry":"IT Services and IT Consulting","company_url":"https:\/\/nz.linkedin.com\/company\/dataenginenz","company_logo":"https:\/\/media.licdn.com\/dms\/image\/v2\/D560BAQFKsROSea5FBw\/company-logo_100_100\/company-logo_100_100\/0\/1709518821401\/dataenginenz_logo?e=2147483647&v=beta&t=hUAAB7CicjI4atrFq_lt_RHB8IOGRzpr1xcP-Ab7RyI","company_url_direct":null,"company_addresses":null,"company_num_employees":null,"company_revenue":null,"company_description":null,"skills":null,"experience_range":null,"company_rating":null,"company_reviews_count":null,"vacancy_count":null,"work_from_home_type":null,"search_term":"Data scientist","search_location":" , travel, work and connect.\n   \n\n  \n\n**Ka whiwhi koe i te aha \\| What you will get in return**\n* Competitive salary and benefits package.\n* Flexible working arrangements.\n* Along with our other\u202fbenefits\u202fwe also have 5 weeks annual leave and an Income Protection and Critical illness Insurance scheme available for all permanent employees.\n\n\n**Me p\u0113hea te tuku tono** \n**\\|** \n**How to apply:**\n Please click apply to upload your CV and cover letter detailing your suitability for the role.\n   \n\n  \n\n**R\u0101 Katinga \\| Applications close:**\n 25 July 2025\n   \n\n  \n\n For further information, email: careers@nzta.govt.nz\n   \n\n  \n\n To be considered for this position you must have a legal right to live and work in New Zealand.\n   \n\n  \n\n Waka Kotahi is an equal opportunity employer (EOE). We recognise the importance of diversity and inclusion and are committed to providing a working environment that embraces these values. Please let us know if you need any support or have any access requirements that will help you through the recruitment process.\n   \n\n  \n\n Please note that we may begin shortlisting as we receive applications. We encourage early applications as we may withdraw the advertising at any time.","company_industry":"Government Administration","company_url":"https:\/\/nz.linkedin.com\/company\/nztransportagency","company_logo":"https:\/\/media.licdn.com\/dms\/image\/v2\/D560BAQH6Uw-UZUZW4w\/company-logo_100_100\/company-logo_100_100\/0\/1705539076476\/new_zealand_transport_agency_logo?e=2147483647&v=beta&t=JBeGc8zbanNudCBzdGWkd86tCoIXo22I49HIN-tDvf4","company_url_direct":null,"company_addresses":null,"company_num_employees":null,"company_revenue":null,"company_description":null,"skills":null,"experience_range":null,"company_rating":null,"company_reviews_count":null,"vacancy_count":null,"work_from_home_type":null,"search_term":"Data scientist","search_location":"Auckland, New Zealand","job_hash":"10692b45c000c1bfdf ty features, with PMs, designers, engineers, and business stakeholders.\n \n\n\n\n \\- Prototype and productionise AI\\-powered systems to enhance Tracksuit's buying flows, personalized demos, and subscription management tools.\n \n\n\n\n \\- Design and implement generative AI solutions, including advanced prompt engineering, scalable LLM infrastructure, and robust monitoring for reliability.\n \n\n\n\n**Lead data\\-driven experimentation** \n\n\n\n\n \\- Own the experimentation process, identifying high\\-leverage growth opportunities and rigorously testing hypotheses through data\\-driven methods.\n \n\n\n\n \\- Continuously analyze key metrics to inform decisions, refine experiences, and optimize outcomes for customers and internal teams.\n \n\n\n\n**Scale operational workflows through automation** \n\n\n\n\n \\- Automate workflows across Sales, Customer Success, Partnerships, and Operations, streamlining processes to improve productivity and efficiency.\n \n\n\n\n \\- Build predictive systems that proactively surface renewal, upsell, and expansion opportunities, empowering commercial teams with actionable insights.\n \n\n\n\n**Champion best practices in AI and data science** \n\n\n\n\n \\- Promote and uphold high standards in modeling, experimentation, and AI ethics across the organization, with the Data Science team\n \n\n\n\n \\- Foster a collaborative, data\\-driven culture within and beyond the GTM Systems team.\n \n\n\n\n  \n\n\n\n\n\n**\ud83d\udc49 What you'll work on:** \n\n\n\n\n This role is wide\\-ranging and high\\-leverage. You\u2019ll work on a portfolio across several of the following areas:\n \n\n\n\n \\- Buying experiences (e.g. personalised demo flows, AI survey builder)\n \n\n\n\n \\- Pricing, packaging, and deal configuration tools\n \n\n\n\n \\- Subscription management and billing systems\n \n\n\n\n \\- CRM and customer data infrastructure\n \n\n\n\n \\- Renewal, upsell, and customer health workflows\n \n\n\n\n \\- Internal sales enablement platforms and automation\n \n\n\n\n \\- Signals, alerts, and workflows that surface expansion\/renewal opportunities\n \n\n\n\n  \n\n\n\n\n\n**About you:** \n\n\n\n* **You\u2019re an experienced senior data scientist (5\\+ years in a similar data scientist position)** \n You\u2019ve worked in embedded product teams to ship data\\-driven systems at scale, ideally in a SaaS environment.\n* **You\u2019re metrics\\-driven** \n This is a growth role at its core. You\u2019re driven by impact, obsessed with identifying leading indicators that matter, and have led rapid experimentation cycles to move the needle. Data analytics in Python and SQL are your bread and butter.\n* **You\u2019re a strong systems and process thinker** \n You see the bigger picture and architect systems that address the fundamental issues. You don\u2019t blindly optimise existing workflows.\n* **You have proven experience building non\\-deterministic systems** \n Generative AI is critical to this role. You have demonstrated success developing AI workflows, combining best practice prompt engineering with developing right\\-sized LLM infrastructure with robust monitoring and evaluation and thoughtful design patterns.\n* **You\u2019re collaborative and kind** \n As a member of our quad leadership teams, you are a natural collaborator, bring people along with clear thinking and great communication, and love winning as a team.\n\n\n\n  \n\n\n\n\n\n**Why we think this role is exciting:** \n\n\n\n* You\u2019ll help shape how modern SaaS companies grow, combining the latest generative AI with best practices from data\\-driven experimentation.\n* You\u2019ll build real products. Data Scientists don\u2019t work in a silo at Tracksuit. You\u2019ll play a leadership role alongside Product, Design, and Engineering to develop products that impact revenue, experience, and internal scale.\n* You\u2019ll work alongside a talented and kind team that values autonomy, curiosity, and craftsmanship.\n* You\u2019ll play a k
