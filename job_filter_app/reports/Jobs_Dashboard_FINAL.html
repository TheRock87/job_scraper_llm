 and career goals. We look forward to you joining our family. \\*\\*\\*\n   \n\n  \n\n SIMILAR CAREER TITLES\n   \n\n  \n\n Data Scientist, AI Engineer, Deep Learning Engineer, Artificial Intelligence Engineer, Research Scientist, Data Engineer, NLP Engineer, Computer Vision Engineer, AI\/ML Researcher, Data Analyst, ect.\n   \n\n  \n\n DEGREE (Level Desired)\n   \n\n  \n\n Bachelor's Degree\n   \n\n  \n\n DEGREE (Focus)\n   \n\n  \n\n Computer Science, Data Science, Artificial Intelligence, Mathematics, Statistics, Software Engineering, Electrical Engineering, Robotics, Computational Biology, Physics, ect.\n   \n\n  \n\n**Alternate Experience**\n General comment on degrees: Most contracts allow additional experience (4\\-5 years) in lieu of a Bachelor's Degree. Some contracts give 4\\-5 years experience credit for a Bachelor's Degree. Some contracts give 2 years experience credit for a Master's Degree. We will work with you to find the right fit.\n   \n\n  \n\n**Position Responsibilities**\n* Strong understanding of machine learning algorithms (supervised, unsupervised, reinforcement learning)\n* Ability to design, implement, and optimize machine learning models and workflows\n* Experience working with large, complex datasets\n* Knowledge of data preprocessing and feature engineering\n* Familiarity with cloud\\-based platforms for machine learning (e.g., AWS, Google Cloud, Azure)\n* Strong problem\\-solving skills and analytical thinking\n\n\n**Required Skills**\n* Proficiency in programming languages (e.g., Python, R, Java)\n* Experience with machine learning frameworks (e.g., TensorFlow, PyTorch, Scikit\\-learn)\n* Expertise in model evaluation techniques and metrics\n* Strong knowledge of version control tools (e.g., Git)\n* Experience with data visualization tools (e.g., Matplotlib, Seaborn, Tableau)\n* Understanding of database technologies (e.g., SQL, NoSQL)\n\n\n**Desired Skills**\n* Experience with natural language processing (NLP)\n* Knowledge of deep learning techniques (e.g., CNNs, RNNs)\n* Familiarity with deployment tools (e.g., Docker, Kubernetes)\n* Experience with data augmentation and synthetic data generation\n* Ability to collaborate in cross\\-functional teams (e.g., engineers, product managers)\n* Knowledge of edge computing and model optimization for deployment\n\n\n PLUG IN to CYMERTEK \\- And design your future...\n   \n\n  \n\n YOUR FOREVER CAREER STARTS HERE\n   \n\n  \n\n Are you looking for more than just a job? Join a company where employees are treated like family, and your career is built to last. We are a growing small business and a trusted federal contractor offering full scope consulting services in information technology, cybersecurity, and analyst workforce development.\n   \n\n  \n\n At our company, you come first. We\u2019re committed to creating an environment where you\u2019ll thrive professionally and personally. We provide meaningful, challenging work using cutting\u2013edge technologies while investing in your growth and success. With direct access to company leadership, a laid\u2013back and inclusive atmosphere, and exceptional work\u2013life balance, you\u2019ll feel valued every day.\n   \n\n  \n\n We also believe in taking care of our family \u2013 both yours and ours. Our benefits are phenomenal, family\u2013friendly, and designed with your well\u2013being in mind. From employee and family events to career\u2013long support, we create a community you\u2019ll never want to leave.\n   \n\n  \n\n Ready to make your next move the best one? Join us and experience the difference.\n   \n\n  \n\n**Benefits**\n* Excellent Salaries\n* Flexible Work Schedule\n* Cafeteria Style Benefits\n* 10% \\- 401k Matching (Vested Immediately)\n* Additional 401k Profit Sharing\n* 30 days Paid Leave\/Holiday (No Use or Lose!)\n* The day off for your birthday\n* Medical\/Dental\/Vision \\- 100% employee coverage. ($1200 allowance \\- or a bonus)\n* HSA\/FSA\n* AFLAC\n* Long Term\/Short Term Disability \ goal to connect as many people as possible to the content they want in the simplest ways.\u202f If you are an IT professional who strives to deliver results through collaborative partnerships, understanding what drives business,\u202fand enjoys working in a connected culture, we can\u2019t wait to meet you!\n   \n\n  \n\n**The ideal candidate will have the following minimum qualifications:**\n* Bachelor\u2019s degree in computer science\/computer engineering or related field\n* 2\\+ years\u2019 experience in designing, developing, and implementing AI and machine learning systems, solutions, applications, and services\n\n\n**We prefer:**\n* Working knowledge of basic software development languages and principles\n* Knowledge of a focused set of tools and technology related to AI, Gen\\-AI, machine learning, and data science\n* Knowledge of Development Tools with demonstrated experience in appropriate development tools \u2013 Python, AI\/machine learning\/data manipulation packages of Python, TensorFlow, PyTorch, RESTFul services development frameworks like Flask, and AI APIs.\n* Working knowledge of client\\-server architectures, RESTFul APIs, Model service frameworks, and test\\-driven development\n* Ability to evaluate public domain and open\\-source model architectures, fine tune, calibrate, and re\\-train them as needed.\n* Ability to build and evaluate the custom machine learning models to suite the needs such as prediction, classification, forecasting, or other general\\-purpose modeling\n\n\n**The AI Engineer key responsibilities are:**\n* Develops internal and external facing AI, machine learning, and data science software applications.\n* Contributes to all the phases of AI solutions development life cycle support including specifications, prototypes, development, quality assurance, code reviews, and deployment.\n* Works with team members to identify and enforce best practices, models, etc.\n* Explores new technologies, models, and development techniques.\n* Coordinates with users and product owners to gather basic requirements.\n\n\n*Hiring Salary Range: $95,295 \\- $120,834k. This range represents the anticipated low and high end of the salary for this position. It will be determined by factors including but not limited to: the applicant\u2019s education, experience, knowledge, skills, and abilities, geographic location, as well as internal equity and alignment with market data.*\n**Additional Information**\n**Perks\/Benefits:**\n* A highly competitive compensation package with generous benefits beginning first day of employment for Medical\/Prescription Drug plans, HSA, Vision, Dental and Health Care FSA.\n+ 15 vacation days \\& 12 sick days accrued annually and 3 personal days\n+ 401K match, Life and AD\\&D, Employee Assistance programs, Group Legal, \\& more\n+ Wellness program with access to onsite gym and basketball court for associates\n\n* Encouraged continued education with our tuition reimbursement program\n* Financial and in\\-kind opportunities to engage with non\\-profits in your community\n+ Company match program for United Way donations\n+ Volunteer opportunities and in\\-kind drives for non\\-profits throughout the year\n\n* Take breaks or brainstorm in our game room with ping pong \\& foosball\n* Casual Dress Code \\& Flexible Schedules (per team)\n\n\n The world is reading, and Ingram Content Group (\u201cIngram\u201d) connects people with content in all forms. Providing comprehensive services for publishers, retailers, libraries and educators, Ingram makes these services seamless and accessible through technology, innovation and creativity. With an expansive global network of offices and facilities, Ingram\u2019s services include digital and physical book distribution, print\\-on\\-demand, and digital learning. Ingram Content Group is a part of Ingram Industries Inc. and includes Ingram Book Group LLC, Ingram Publisher Services LLC, Lightning Source LLC, Ingram Library Services LLC, Tennessee Book Company LLC, Ingram Content Group UK Ltd. and Ingram Content Group Australia Pty Ltd.\n   \n\n  \n\n*All qualified applicants will receive consideration for employment without regard to race, color, religion, sex, national origin, age, work related mental or physical disability, veteran status, sexual orientation, gender identity, or genetic information.*\n* EOE\\-Race\/Gender\/Veterans\/Disabled\n* We participate in EVerify.\n* EEO Poster in English\n* EEO Poster in Spanish","company_industry":"Book and Periodical Publishing","company_url":"https:\/\/www.linkedin.com\/company\/ingram-content-group","company_logo":"https:\/\/media.licdn.com\/dms\/image\/v2\/C560BAQGrH74B3l14sg\/company-logo_100_100\/company-logo_100_100\/0\/1630641296627\/ingram_content_group_logo?e=2147483647&v=beta&t=kOx8tSYLhIYw67GqRLSSGRyyggTLi3kXPEUmnFd7dSU","company_url_direct":null,"company_addresses":null,"company_num_employees":null,"company_revenue":null,"company_description":null,"skills":null,"experience_range":null,"company_rating":null,"company_reviews_count":null,"vacancy_count":null,"work_from_home_type":null,"search_term":"Ai engineer","search_location":"Abu Dhabi, UAE","job_hash":"350a4f8d3c267190ec54fc8fc5758846","Is_Junior_AI_Job":"Yes","Country":"UAE"},{"id":"li-4265747480","site":"linkedin","job_url":"https:\/\/www.linkedin.com\/jobs\/view\/4265747480","job_url_direct":"https:\/\/www.adzuna.com\/details\/5298664498?v=1B0D740A7108932DE7B1CB1923FA2A0D89E78574&r=19783719&ccd=12f48fe1ce1d36fad5dc09cc7847256c&frd=6e7efdcc330400e18732341abb1a6aa8&utm_source=linkedin7&utm_medium=organic&chnlid=1931&title=AI%20Engineer&a=e&urlHash=qnfV","title":"AI Engineer","company":"Pylon","location":"Menlo Park, CA","date_posted":null,"job_type":"fulltime","salary_source":null,"interval":null,"min_amount":null,"max_amount":null,"currency":null,"is_remote":false,"job_level":"entry level","job_function":"Engineering and Information Technology","listing_type":null,"emails":null,"description":"At Pylon, we're a small team building a very ambitious product in the mortgage space.\n   \n\n  \n\n At this early stage, we're looking for engineers who see the opportunity to apply LLMs thoughtfully not as an end in itself, but as a tool to reduce complexity, improve decisions, and deliver meaningful automation.\n   \n\n  \n\n We're in search of people who love working at the intersection of algorithms, data, and software engineering and who are excited to ship LLM\\-enabled systems as part of a deeply technical product team.\n   \n\n  \n\n**You**\n**About you**\n* You're a strong traditional engineer first. You have a solid foundation in software engineering and computer science fundamentals. You care about system design, code quality, and building things that work reliably at scale.\n* Write clean, maintainable code. This is a production engineering team. We need code that other engineers can understand, modify, and trust\u2014especially when dealing with the inherent unpredictability of LLMs.\n* Love hard problems. Complex solution spaces excite you. Maybe that means orchestrating multiple LLMs, applying optimization techniques, or recognizing when a rules engine is actually the best answer.\n* Are rigorous about impact. When you build something, you care whether it correctly models and solves the core domain problem. You're excited to dig deep into mortgage domain algebra and build the right abstractions. You choose the right tool for each problem\u2014sometimes that's an LLM, sometimes it's a simple heuristic.\n* Are comfortable in unfamiliar domains. Mortgage expertise isn't required. What matters is your eagerness to learn the constraints and nuances that make solutions actually work in practice.\n* Have gotten your hands dirty with LLMs. You've experimented with LLMs\u2014maybe through personal projects, hackathons, or just tinkering on weekends. You understand the basics of prompt engineering, context management, and the development cycle. This role is your chance to apply that curiosity at production scale.\n* Are genuinely excited about language models. You've been following the space, reading papers or blog posts, trying out new models and techniques. You understand their potential and limitations. Professional LLM experience isn't required\u2014we're looking for informed enthusiasm and hands\\-on curiosity.\n\n\n**About The Team**\n**What we're not:**\n**Building a CRUD App**\n We're building a platform that's only possible due to deep technology investments and thinking hard from first principles. Cargo\\-culting what's come before won't be sufficient.\n   \n\n  \n\n If you're looking to do mostly plumbing \/ lego piece assembling, Pylon may be very frustrating for you\n   \n\n  \n\n**An LLM Wrapper**\n Mortgage is a sprawling mess of problems, and there isn't one tool that solves every one of them. We use LLMs, but we've reached for tools in multiple disciplines like mixed\\-integer linear optimization and programming language research.\n   \n\n  \n\n**An Easy Job**\n We're building a lot of things from the ground up for the first time. Working at Pylon is like a research project where you have to ship to intelligent, opinionated customers regularly.\n   \n\n  \n\n It's basically guaranteed you'll be handed a task that is too difficult for you to do. You might fail sometimes. You might have no idea where to start. Our team leans heavily on each other, but there's no getting around the difficulties.\n   \n\n  \n\n**What We Are**\n**A small team:**\n We don't have an army of engineers. If you find something is broken, you are probably the best one to fix it.\n   \n\n  \n\n All the code we write has to punch above its weight in maintainability and toil reduction. If you have a good idea, you have much more ability to put it into action than at a large company.\n   \n\n  \n\n**We need generalists:** \n Specialization is for big companies that already have everything figured out. If you're smart, flexible and like getting into everything, we want you.\n   \n\n  \n\n**Working in a regulated space:** \n Mortgage is regulated both federally and at the state level.\n   \n\n  \n\n We move fast, but breaking things isn't an option.\n   \n\n  \n\n**About The Job**\n**Job title:** \n LLM Engineer\n   \n\n  \n\n**Stock options:** \n Own a piece of the company and we all win together\n   \n\n  \n\n**Benefits:** \n Health insurance, 401K, dental, etc.\n   \n\n  \n\n**Our Technology Stack**\n We don't require prior experience in all of these\u2014just an eagerness to learn and strong fundamentals:\n   \n\n  \n\n* TypeScript across frontend and backend\n* PostgreSQL\n* GraphQL\n* NestJS\n* Nx build system\n* Sagittarius\n* AWS CDK \\+ ECS\n\n\n**In This Role, You'll**\n* Design and implement LLM\\-powered features that improve automation, decisioning, or user experience\n* Build robust workflows and agent strategies with effective context management\n* Work across the stack to integrate LLMs into production systems with clean interfaces\n* Prototype and evaluate new LLM techniques and approaches when they solve real customer problems\n* Partner with engineers, PMs, and domain experts to turn fuzzy product ideas into scalable systems\n* Maintain a healthy skepticism and bias toward simplicity, knowing when LLMs are the right choice and when they aren't\n\n\n**About Pylon**\n The $13 trillion mortgage industry at the core of the American economy runs on broken assembly lines with human\\-powered workflows, stitched\\-together software, and a series of capital markets intermediates. The costs to originate are at an all time high despite foundational shifts in technology.\n   \n\n  \n\n Pylon is rewiring mortgages from the ground up. We are building the only API\\-first, programmatic infrastructure that fully automates credit, compliance, capital, and operations. For the first time, originators can build and scale mortgage businesses entirely through software, not people. Our team comes from Stripe, Better, and Affirm, and we are backed by Conversion Capital, QED, Citi, Fifth Wall, Peter Thiel, and the founders of Ramp, Mercury, Blend, and others.","company_industry":"Technology, Information and Internet","company_url":"https:\/\/www.linkedin.com\/company\/usepylon","company_logo":"https:\/\/media.licdn.com\/dms\/image\/v2\/D560BAQH0WqYdLbcuxA\/company-logo_100_100\/company-logo_100_100\/0\/1707520151724\/usepylon_logo?e=2147483647&v=beta&t=lNo0GRQISNTRDIhcXKRR1aoRdZtkijbUEfhdxJe6b7Y","company_url_direct":null,"company_addresses":null,"company_num_employees":null,"company_revenue":null,"company_description":null,"skills":null,"experience_range":null,"company_rating":null,"company_reviews_count":null,"vacancy_count":null,"work_from_home_type":null,"search_term":"Ai engineer","search_location":"Abu Dhabi, UAE","job_hash":"2f3fe4c9f1a3892fcfc07b40d176638d","Is_Junior_AI_Job":"Yes","Country":"UAE"},{"id":"li-4241040043","site":"linkedin","job_url":"https:\/\/www.linkedin.com\/jobs\/view\/4241040043","job_url_direct":null,"title":"Senior AI Engineer","company":"Cambium","location":null,"date_posted":null,"job_type":"fulltime","salary_source":"description","interval":"yearly","min_amount":160000.0,"max_amount":190000.0,"currency":"USD","is_remote":true,"job_level":"mid-senior level","job_function":"Engineering and Information Technology","listing_type":null,"emails":null,"description":"**Description** \n\n\n\n\n**About Us** \n\n\n\n\n Cambium is a growth stage start\\-up using technology to make it easy to access material we normally waste, turning salvaged lumber into Carbon Smart Wood\u2122. We recently closed a $18\\.5M Series A funding round to make it easier to buy, sell, and move fiber across the supply chain. In addition to being named one of Fast Company\u2019s Most Innovative Companies of 2024, we serve clients like Amazon, Equinox, Room \\& Board, and other leading brands in the construction, design, and furniture industries. It\u2019s an exciting time of growth for Cambium, and we\u2019re looking for ambitious, energetic people to join our mission.\n \n\n\n\n**About This Role** \n\n\n\n\n As a Senior AI Engineer at Cambium Carbon, you\u2019ll help lead the integration of AI and machine learning across both our external products and internal operations. You\u2019ll prototype and validate applied AI use cases\u2014from forecasting and summarization to generative UI and semantic search\u2014collaborating closely with software engineers to bring those prototypes to production. In parallel, you\u2019ll play a central role in helping Cambium become an AI\\-native organization: enabling teammates across departments to adopt and benefit from AI tooling, building lightweight internal apps, and leading training and implementation initiatives. This role is ideal for someone with deep expertise in ML and LLMs, who is excited by both the hands\\-on design of AI systems and the human impact of AI inside a growing startup.\n \n\n\n\n**What You\u2019ll Do Here** \n\n\n\n* Design and prototype AI\\-powered product features, including search and discovery tools, data classifiers, forecasting models, summarization engines, and generative UI components.\n* Evaluate and integrate third\\-party LLM services and tools (e.g. OpenAI, Hugging Face, vector DBs, agent frameworks) to rapidly test and scale intelligent features.\n* Collaborate with PMs, designers, and software engineers to translate prototypes into production\\-grade implementations.\n* Own the internal AI enablement roadmap, including building lightweight tools, guiding workflow automation, and educating teams across Cambium on how to use AI effectively.\n* Act as an internal consultant and hands\\-on partner to departments like Sales, Supply, and Marketing, helping them unlock value from AI in their day\\-to\\-day work.\n* Stay abreast of developments in generative AI and machine learning and evaluate which emerging tools, frameworks, and patterns are worth bringing into Cambium\u2019s stack.\n* Represent Cambium\u2019s AI approach in cross\\-functional, customer\\-facing, and leadership conversations.\n\n\n\n**Your Skill Sets And Capabilities Include** \n\n\n\n* 4\\-5\\+ years of professional experience working on applied AI\/ML problems, with demonstrated expertise in prototyping and deploying models and workflows.\n* Experience working with or integrating LLMs and associated tooling (e.g., OpenAI APIs, Hugging Face, LangChain \/ LangGraph, Pinecone, Weaviate, etc.).\n* Experience building and deploying high performance deep\\-learning models using either Tensorflow or PyTorch on significant complexity industrial\/commercial datasets.\n* Ability to scope and deliver end\\-to\\-end AI prototypes, with strong intuitions around data prep, prompt engineering, fine\\-tuning, and evaluation.\n* ?Experience with AI SDKs and building enterprise\\-grade systems utilizing different AI technologies and providers.\n* A strong understanding of ML fundamentals and real\\-world constraints\u2014model choice, latency, interpretability, privacy, failure modes, etc.\n* Skilled at distilling technical topics to non\\-technical stakeholders and leading effective enablement efforts (training, documentation, tool handoffs).\n* Highly collaborative: thrives in multi\\-stakeholder environments and knows how to bridge product, engineering, and operations through AI.\n* Bonus experience: intelligent agent frameworks, geospatial AI, sustainability tech, or ML applications in supply chains or logistics.\n\n\n\n**The Details** \n\n\n\n\n This role will report to: Patrick Coughran, VP of Engineering\n \n\n\n\n Salary Range: $160,000\u2013$190,000\n \n\n\n\n When: Q2 2025\n \n\n\n\n Where: US Remote, with occasional travel for company or engineering retreats\n \n\n\n\n**Benefits And Perks** \n\n\n\n* Equity options package\n* Unlimited PTO and flexible schedule\n* 401k matching\n* Comprehensive medical, dental \\& vision insurance\n* Work with an incredibly smart, div ation with Microsoft, this team focuses on building, developing, and supporting our Azure cloud platforms to accelerate the time\\-to\\-market of innovative finance products. As part of the AI Platform Engineering squad, you will implement, optimise and scale innovative AI workloads across LSEG.\n   \n\n  \n\n* Design and build AI tools and products to improve developer experience.\n* Perform POVs and POCs of the emerging AI\/GenAI technologies to determine the business value they add to LSEG.\n* Mentor and guide junior AI engineers and application teams, encouraging best practices in consumption of Azure AI and Data services.\n* Work alongside architects, developers and other engineers to ensure efficient Azure AI services and models are designed and consumed aligned to LSEG's Enterprise Scale Landing Zone.\n* Stay up to date with the latest advancements in AI to enable application teams to build innovative products.\n* Implement best practices for data quality, security, and compliance.\n* Ensure knowledge articles of all supported systems are continually updated.\n\n\n**Candidate Profile \/ Key Skills**\n**Tech Profile\/Essential Skills**\n* Hands on experience in developing and implementing AI and Data cloud solutions.\n* Experience working with Azure AI services (or AWS, GCP) and AI model deployment.\n* Understanding of generative AI, LLMs, NLP, and machine learning frameworks (TensorFlow, PyTorch, Hugging Face, etc.).\n* Understanding of the AI application lifecycle, including application prototyping, productionising and monitoring.\n* Python \/ Go \/ R.\n* Problem solving skills.\n* Strong written and verbal communication skills.\n\n\n**Preferred Skills And Experience**\n* Working knowledge of DevOps practices, including CI\/CD pipelines, automated testing and agile methodologies.\n* Proficiency in infrastructure as code (IaC) using tools like Terraform.\n* Experience with MLOps tools, frameworks and practices.\n\n\n**Education And Professional Skills**\n Nic th or equivalent\n* 3\\+ years of professional experience in building information retrieval systems and\/or graph\\-based recommendation systems.\n* 3\\+ years of hands\\-on professional experience in developing text\\-based or graph\\-based machine learning models for production, including data processing, model fine\\-tuning, model deployment and model evaluation\n* 2\\+ years of professional experience in building services to host machine learning models in production at scale\n* 2\\+ years of professional experience working with large language models (LLMs), text generation models, and\/or graph neural network models for real\\-world use cases\n* 2\\+ years of professional experience in machine learning and deep learning frameworks \\& toolkits such as Pytorch, TensorFlow, and Sklearn\n* 2\\+ years of professional experience with data engineering and data wrangling using e.g. Pandas and PySpark and other industry tools used to build scalable machine learning systems, such as Kubernetes and Docker\n* 2\\+ years of professional experience with cloud computing platforms (e.g. AWS, GCP, etc.)\n* Deep understanding of statistical analysis, unsupervised and supervised machine learning algorithms, and natural language processing for information retrieval and\/or recommendation system use cases\n\n\n**Other Qualifications:**\n* Exposure to advanced techniques such as reinforcement learning and graph neural networks\n* Standout colleague, strong communication skills, with experience working across functions and teams. Ability to teach, mentor and lead through influence\n* Bonus points for relevant PhD and\/or machine learning related research publications\n\n\n**Workday Pay Transparency Statement**\n The annualized base salary ranges for the primary location and any additional locations are listed below. Workday pay ranges vary based on work location. As a part of the total compensation package, this role may be eligible for the Workday Bonus Plan or a role\\-specific co rough to deployment in Netflix's large\\-scale, real\\-time systems.\n* Optimize the performance and scalability of machine learning models, ensuring they can handle the diverse tastes and behaviors of our global member base.\n* Design and conduct offline experiments and A\/B tests to validate the impact of algorithmic changes on key business metrics.\n* Contribute to the ongoing improvement of our ML infrastructure and tooling, ensuring that we stay at the cutting edge of industry practices.\n* Engage in continuous learning and development, staying up\\-to\\-date with the latest advances in machine learning and software engineering.\n\n\n**What We Are Looking For**\n* 5\\+ years of experience in applying machine learning in an industrial setting, with a track record of delivering impactful results.\n* PhD or Masters in Computer Science, Statistics, or a related field\n* Expertise in machine learning algorithms and frameworks, with hands\\-on experience in training, tuning, and deploying models in production environments.\n* Excellent software design and development skills in Python along with Scala, Java, C\\+\\+, or C\\#\n* Experience in one or more of the following applied fields: Recommendations, Personalization, Long\\-term Reward Modeling, Bandits, Transformers, Large\\-Scale Language Models, LLM evaluation, RLHF reward modeling\/alignment\n* Great interpersonal skills including strong written and verbal communication\n\n\n**Preferred Qualifications**\n* Experience building or enhancing personalization systems, search engines, or similar large\\-scale machine learning applications.\n* Background in neural networks, natural language processing, or causal inference\n* Contributions to open\\-source projects in machine learning or related fields.\n* Experience working with cross functional teams\n\n\n**Links**\n* Netflix Research site\n* Our culture\n* Our long term business view\n\n\n Our compensation structure consists solely of an annual salary; we do not have ment of artificial intelligence across industry sectors.\n   \n\n  \n\n It is deploying a comprehensive set of AI\\-focused services, including robust training, networking, and innovation support structures.\n   \n\n  \n\n Its mission is to foster the uptake and effective use of AI, particularly among SMEs and startups across participating countries, and to strengthen the European innovation ecosystem.\n   \n\n  \n\n These services are powered by the AI\\-specific partition of the MareNostrum5 supercomputer, one of the most advanced infrastructures in Europe, designed to meet the evolving AI needs by harnessing the latest AI\\-oriented computing technologies.\n   \n\n  \n\n Within the Earth Sciences department, the selected MLOps Engineer will support the development, deployment, and operationalization of AI services related to Earth Sciences applications.\n   \n\n  \n\n This includes contributing to real\\-world applications with direct scientific and societal impact.\n   \n\n  \n\n The candidate will be responsible for managing the integration and availability of AI software tools, developed internally by consortium partners or externally by third parties, on the MareNostrum5 AI partition.\n   \n\n  \n\n This involves ensuring compatibility, performance, and scalability of AI workloads on the MN5 infrastructure and providing technical support to the broader AI Factory user community.\n   \n\n  \n\n The role will involve close collaboration with researchers, developers, and system administrators to streamline workflows, automate deployment pipelines, and maintain robust, reproducible AI environments using best practices in MLOps.\n   \n\n  \n\n This project is funded by the European Union's Recovery and Resilience Facility, in accordance with Council Regulation (EU) 2020\/2094 of 14 December 2020, and regulated by Regulation (EU) 2021\/241 of the European Parliament and of the Council of 12 February 2021, in the context of the \"BSC AI Factory\" project.\n   \n\n ubernetes), and workflow orchestration (Airflow, Kuberflow).\n* Experience with CI\/CD tools and working with Git.\n* Excellent communication skills, and the ability to work effectively with others in a team environment, and the ability to translate technical concepts for non\\-technical stakeholders.\n\n\n**What We Offer You**\n Zynga offers a world\\-class benefits package that helps support and balance the needs of our teams. To find out more about our benefits, visit the Zynga Benefits site\n   \n\n  \n\n*The pay range for this position in California at the start of employment is expected to be between $123,500 and $182,780 per year.*\n*However, base pay offered is based on market location, and may vary further depending on individualized factors for job candidates, such as job\\-related knowledge, skills, experience, and other objective business considerations. Subject to those same considerations, the total compensation package for this position may also include other elements, including a bonus and\/or equity awards, in addition to a full range of medical, financial, and\/or other benefits. Details of participation in these benefit plans will be provided if an employee receives an offer of employment. If hired, employee will be in an \"at\\-will position\" and the Company reserves the right to modify base salary (as well as any other discretionary payment or compensation or benefit program) at any time, including for reasons related to individual performance, Company or individual department\/team performance, and market factors.*\n We are proud to be an equal opportunity employer, which means we are committed to creating and celebrating diverse thoughts, cultures, and backgrounds throughout our organization. Employment with us is based on substantive ability, objective qualifications, and work ethic \u2013 not an individual\u2019s race, creed, color, religion, sex or gender, gender identity or expression, sexual orientation, national origin or ancestry, alie of data structures and algorithms\n* Great communication and teamwork skills\n\n\n Preferred Qualifications\n   \n\n  \n\n* Passion about techniques and solving challenging problems\n* Previous experience in applications of machine learning, pattern recognition, NLP, data mining, or computer vision\n\n\n By submitting an application for this role, you accept and agree to our global applicant privacy policy, which may be accessed here: https:\/\/careers.tiktok.com\/legal\/privacy.\n   \n\n  \n\n If you have any questions, please reach out to us at apac\\-earlycareers@tiktok.com\n   \n\n  \n\n Job Information\n   \n\n  \n\n**About TikTok**\n TikTok is the leading destination for short\\-form mobile video. At TikTok, our mission is to inspire creativity and bring joy. TikTok's global headquarters are in Los Angeles and Singapore, and we also have offices in New York City, London, Dublin, Paris, Berlin, Dubai, Jakarta, Seoul, and Tokyo.\n   \n\n  \n\n Why Join Us\n   \n\n  \n\n Inspiring creativity is at the core of TikTok's mission. Our innovative product is built to help people authentically express themselves, discover and connect \u2013 and our global, diverse teams make that possible. Together, we create value for our communities, inspire creativity and bring joy \\- a mission we work towards every day.\n   \n\n  \n\n We strive to do great things with great people. We lead with curiosity, humility, and a desire to make impact in a rapidly growing tech company. Every challenge is an opportunity to learn and innovate as one team. We're resilient and embrace challenges as they come. By constantly iterating and fostering an \"Always Day 1\" mindset, we achieve meaningful breakthroughs for ourselves, our company, and our users. When we create and grow together, the possibilities are limitless. Join us.\n   \n\n  \n\n Diversity \\& Inclusion\n   \n\n  \n\n TikTok is committed to creating an inclusive space where employees are valued for their skills, experiences, and uni "not applicable","job_function":"Engineering and Information Technology","listing_type":null,"emails":null,"description":"**Machine Learning Engineer (MLE), Artificial Intelligence**\n Join us as we pursue our disruptive new vision to make machine data accessible, usable and valuable to everyone. We are a company filled with people who are passionate about our product and seek to deliver the best experience for our customers. At Splunk, we\u2019re committed to our work, customers, having fun and most importantly to each other\u2019s success. Learn more about Splunk careers and how you can become a part of our journey!\n   \n\n  \n\n Role\n   \n\n  \n\n As a Machine Learning Engineer in the Artificial Intelligence group, you will be responsible for developing the core AI\/ML capabilities to power the entire Splunk product portfolio and help our customers to drive their journey to digital resiliency. You will collaborate with cross\\-functional teams, mentor junior team members, and help drive the engineering roadmap of the area.\n   \n\n  \n\n**Responsibilities**\n The responsibilities of this role include\n   \n\n  \n\n* Development of the AI\/ML platform and infrastructure that drives our product\u2019s key ML use cases in the cybersecurity and observability domains.\n* Collaborate closely with software engineers, applied scientists, and product managers to integrate generative AI solutions into our products and services.\n* Stay up to date with the latest developments in the field of AI\/ML, and ensure that these advancements are properly incorporated into our technology roadmap.\n* Actively participate in cross\\-functional discussions and strategic decisions related to AI directions and product roadmaps.\n\n\n**Requirements**\n Knowledge, Skills, and Abilities\n   \n\n  \n\n* Bachelor's or Master's degree in Computer Science, Engineering, or a related field with at least 3\\+ years of industry experience.\n* Experience with containerization and orchestration tools (e.g., Docker, Kubernetes).\n* Experience with model deployment and serving into production environments\n* Knowledge of version control systems, especially Git.\n* Knowledge of CI\/CD principles and tools.\n* Familiarity with cloud platforms (AWS, GCP, Azure) and serverless architecture.\n* Experience with MLOps platforms such as MLflow or Kubeflow.\n* Previous experience working in cross\\-functional teams and collaborating with data scientists and DevOps teams.\n* Excellent problem\\-solving skills and the ability to troubleshoot complex issues.\n* Excellent communication skills with the ability to articulate complex technical concepts to both technical and non\\-technical audiences.\n\n\n**Annual Base Pay $158,200 \\- $201,000 USD**\n When available, the salary range posted for this position reflects the projected hiring range for new hire, full\\-time salaries in U.S. and\/or Canada locations, not including equity or benefits. For non\\-sales roles the hiring ranges reflect base salary only; employees are also eligible to receive annual bonuses. Hiring ranges for sales positions include base and incentive compensation target. Individual pay is determined by the candidate's hiring location and additional factors, including but not limited to skillset, experience, and relevant education, certifications, or training. Applicants may not be eligible for the full salary range based on their U.S. or Canada hiring location. The recruiter can share more details about compensation for the role in your location during the hiring process.\n   \n\n  \n\n U.S. employees have access to quality medical, dental and vision insurance, a 401(k) plan with a Cisco matching contribution, short and long\\-term disability coverage, basic life insurance and numerous wellbeing offerings.\n   \n\n  \n\n Employees receive up to twelve paid holidays per calendar year, which includes one floating holiday (for non\\-exempt employees), plus a day off for their birthday. Non\\-Exempt new hires accrue up to 16 days of vacation time off each year, at a rate of 4\\.92 hours per pay period. Exempt new hires participate in Cisco\u2019s flexible Vacation Time Off policy, which does not place a defined limit on how much vacation time eligible employees may use but is subject to availability and some business limitations. All new hires are eligible for Sick Time Off subject to Cisco\u2019s Sick Time Off Policy and will have eighty (80\\) hours of sick time off provided on their hire date and on January 1st of each year thereafter. Up to 80 hours of unused sick time will be carried forward from one calendar year to the next such that the maximum number of sick time hours an employee may have available is 160 hours. Employees in Illinois have a unique time off program designed specifically with local requirements in mind. All employees also have access to paid time away to deal with critical or emergency issues. We offer additional paid time to volunteer and give back to the community.\n   \n\n  \n\n Employees on sales plans earn performance\\-based incentive pay on top of their base salary, which is split between quota and non\\-quota components. For quota\\-based incentive pay, Cisco typically pays as follows\n   \n\n  \n\n* 75% of incentive target for each 1% of revenue attainment up to 50% of quota;\n\n\n 1\\.5% of incentive target for each 1% of attainment between 50% and 75%;\n   \n\n  \n\n 1% of incentive target for each 1% of attainment between 75% and 100%; and once performance exceeds 100% attainment, incentive rates are at or above 1% for each 1% of attainment with no cap on incentive compensation.\n   \n\n  \n\n For non\\-quota\\-based sales performance elements such as strategic sales objectives, Cisco may pay up to 125% of target. Cisco sales plans do not have a minimum threshold of performance for sales incentive compensation to be paid.\n   \n\n  \n\n Splunk, a Cisco company, is an Equal Opportunity Employer and all qualified applicants will rece ree. Some contracts give 2 years experience credit for a Master's Degree. We will work with you to find the right fit.\n   \n\n  \n\n**Position Responsibilities**\n* Proven ability to design AI\/ML models\n* Experience integrating AI systems\n* Strong foundation in algorithm development\n* Familiarity with model optimization methods\n* Proficiency in deploying models at scale\n* Understanding of AI ethics and compliance\n\n\n**Required Skills**\n* Proficiency in programming (e.g., Python)\n* Knowledge of ML frameworks (e.g., TensorFlow)\n* Ability to preprocess and analyze datasets\n* Expertise in supervised and unsupervised learning\n* Familiarity with cloud\\-based AI tools\n* Skill in debugging and testing AI models\n\n\n**Desired Skills**\n* Knowledge of reinforcement learning\n* Familiarity with generative AI models\n* Experience in edge AI implementation\n* Expertise in natural language processing\n* Proficiency in computer vision techniques\n* Understanding of emerging AI\/ML trends\n\n\n PLUG IN to CYMERTEK \\- And design your future...\n   \n\n  \n\n YOUR FOREVER CAREER STARTS HERE\n   \n\n  \n\n Are you looking for more than just a job? Join a company where employees are treated like family, and your career is built to last. We are a growing small business and a trusted federal contractor offering full scope consulting services in information technology, cybersecurity, and analyst workforce development.\n   \n\n  \n\n At our company, you come first. We\u2019re committed to creating an environment where you\u2019ll thrive professionally and personally. We provide meaningful, challenging work using cutting\u2013edge technologies while investing in your growth and success. With direct access to company leadership, a laid\u2013back and inclusive atmosphere, and exceptional work\u2013life balance, you\u2019ll feel valued every day.\n   \n\n  \n\n We also believe in taking care of our family \u2013 both yours and ours. Our benefits are phenomenal, family\u2013friendly, and designed with your well\u2013being in mind. From employee and family events to career\u2013long support, we create a community you\u2019ll never want to leave.\n   \n\n  \n\n Ready to make your next move the best one? Join us and experience the difference.\n   \n\n  \n\n**Benefits**\n* Excellent Salaries\n* Flexible Work Schedule\n* Cafeteria Style Benefits\n* 10% \\- 401k Matching (Vested Immediately)\n* Additional 401k Profit Sharing\n* 30 days Paid Leave\/Holiday (No Use or Lose!)\n* The day off for your birthday\n* Medical\/Dental\/Vision \\- 100% employee coverage. ($1200 allowance \\- or a bonus)\n* HSA\/FSA\n* AFLAC\n* Long Term\/Short Term Disability \\- 100% employee coverage. No cost to you.\n* Life Insurance \\- 100% employee coverage. No cost to you.\n* Additional Discretionary Life Insurance\n* Paid Training\n* No long, wordy reviews with tons of paperwork!!!\n* Referral bonus program with recurring annual payments\n\n\n**How To Apply**\n Email us at jobs@cymertek.com or apply today: www.cymertek.com\n   \n\n  \n\n Want to see what our employees think? Click here .\n   \n\n  \n\n EQUAL OPPORTUNITY EMPLOYER STATEMENT\n   \n\n  \n\n Cymertek is proud to be an Equal Opportunity Employer committed to fostering an inclusive and diverse workplace. We embrace and celebrate differences in our employees, recognizing that a diverse workforce enhances our creativity, innovation, and overall success. At Cymertek, employment decisions are made based on merit, qualifications, and business needs without regard to race, color, religion, sex, sexual orientation, gender identity, national origin, age, disability, veteran status, or any other characteristic protected by applicable laws. We believe in creating an environment where all individuals are treated with respect and dignity, and where opportunities for professional growth and advancement are accessible to everyone, regardless of background or identity.","company_industry":"IT Services and IT Consulting  managers who work together to solve some of the most challenging business problems our clients have. We drive the full analytics life cycle on client engagements: scoping and understanding business challenges, developing and maintaining robust data assets, creating and running innovative analytical techniques, generating compelling visualizations to communicate the findings \/ recommendations. We build, develop, and maintain innovative tools and applications for use across projects and for specific clients. We coach, mentor and train colleagues from across the business, on everything from what types of commercial problems analytical techniques can help solve to in\\-depth technical training for specific types of analysis.\n   \n\n  \n\n We are actively looking for a Data Scientist to join L.E.K.\u2019s rapidly growing Data \\& Analytics team. The primary focus of this role is to provide technical expertise: helping to execute on complex analytics across a wide variety of often fast\\-paced client engagements, helping to build innovative tools and applications that can help solve client\u2019s commercial issues, helping to execute cutting edge analytical techniques, helping to drive technical roadmaps for the function and firm, and training our colleagues.\n   \n\n  \n\n As part of a dynamic and growing team, there is every opportunity to carve out value added work, and to grow your skills and experience. You receive state\\-of\\-the\\-art training in a variety of domains and lead the organization to adopting new and innovative methods to solve our clients\u2019 hardest questions. You won\u2019t just be a technical expert: you will intersect between data science, and commercial business understanding, across a variety of domains to provide analytically driven recommendations to our clients.\n   \n\n  \n\n Data \\& Analytics is one of four key pillars to the Solutions Team at L.E.K. Consulting, alongside Market Insights, Information \\& Research Center and Knowledge ork\n* Provide input into training \/ upskilling the D\\&A team provides to Managing Directors to ensure they are aware of all of our most current capabilities\n\n\n**Capability Development**\n* Stay up to date on best\\-in\\-class software, tools, and techniques to ensure that we are able to provide clients with best\\-in\\-class solutions\n* Support commercialization and upskilling of staff on relevant software, tools and techniques\n* Help drive the technical roadmap to ensure we are operating a best\\-in\\-class Data \\& Analytics function\n\n\n  \n\n  \n\n**Qualifications And Experience**\n* Degree in a quantitative and\/or business discipline preferred, examples include: Statistics, Computer Science, Data Science, Mathematics, Operations Research, Engineering, Economics\n* A minimum of 2 years of experience in applied data science with a solid foundation in machine learning, statistical modeling, and analysis is required for a Data Scientist\n* Strong knowledge, experience, and fluency in a wide variety of tools including Python with data science and machine learning libraries (e.g., scikit\\-learn, TensorFlow, PyTorch), Spark, SQL; familiarity with Alteryx and Tableau preferred\n* Technical understanding of machine learning algorithms; experience with deriving insights by performing data science techniques including classification models, clustering analysis, time\\-series modeling, NLP; technical knowledge of optimization is a plus\n* Expertise in developing and deploying machine learning models in cloud environments (AWS, Azure, GCP) with a deep understanding of cloud services, architecture, and scalable solutions. (e.g., Sagemaker, Azure ML, Kubernetes, Airflow)\n* Demonstrated experience with MLOps practices, including continuous integration and delivery (CI\/CD) for ML, model versioning, monitoring, and performance tracking to ensure models are efficiently updated and maintained in production environments\n* Hands\\-on experience with manipulating and ex ovide opinions with regards to the Privacy and fundamental rights, impacts to data subjects and related risks across CIB, within the BNPP AI and Data Protection Framework and in accordance with applicable laws and procedures. The AI and DP Expert will support CIB DPO and Data Protection Correspondents (DPCs) with guidance and opinions on the AI dimension within any CIB projects or activities, her\/his AI technical knowledge allowing the check and challenge of AI projects against existing risks\n   \n\n  \n\n**Key Responsibilities**\n The AI and DP Expert is a risk professional role with three key dimensions of responsibilities:\n   \n\n  \n\n* Contribution within RISK ORM CIB \u2013 The role will provide guidance on AI and Privacy aspects and will support CIB DPO, other DPCs and other stakeholders within the Data Protection community including within BNP Paribas Group DPO team, , contributing through documented RISK Opinions to the wider management and coordination of projects by the ORO \u2013 AI and ML Expert manager at global RISK ORM CIB level, in relation to privacy and data protection topics.\n* AI regulatory and technical expert \u2013 The role will be able to understand AI technologies, supported by enthusiasm with regards to AI applicable regulations.\n* Privacy expert \u2013 Be the central point of contact and expertise for any privacy related aspects across RISK ORM CIB on AI use cases.\n\n\n**Responsibilities**\n Its activity is part of the overall governance of personal data protection deployed throughout BNP Paribas CIB and it is based on the following key responsibilities:\n   \n\n  \n\n* Advice on the implementation of the Group AI Framework within CIB to meet regulatory AI requirements.\n* Attend AI\\-related meetings and committees with internal stakeholders in first and second level of defence to identify, discuss and assess risks specific to AI projects.\n* Perform second line of defence control and challenge to the first line of defence.\n* Supe ledge in Machine Learning concepts with a special focus on Computer Vision\n* Hands\\-on experience working with Deep Learning toolkits such as Tensorflow or PyTorch\n* Proficiency in SQL\n* Can effectively communicate the results and trade\\-offs to both technical and non\\-technical audiences\n* Enjoy working in a fast\\-paced, highly fluid, and multi\\-functional environment.\n\n\n**Why Veriff?**\n We are the preferred identity verification platform partner for the world\u2019s most innovative growth\\-driven organizations helping conveniently verify and safeguard users anywhere in the world. We support the broadest number of identity documents from nearly every country and territory in the world \\- and this is continually increasing! With a diverse team in the United States, United Kingdom, Spain, and Estonia, as well as robust backing and funding from investors including Accel, Alkeon, IVP, Tiger Capital, and Y Combinator, we\u2019re dedicated to helping businesses and individuals build a safer and more secure world. We strive to be the benchmark for trust online, and we take pride in being a positive force.\n   \n\n  \n\n When you join Team Veriff, we offer you the opportunity to have a real impact and advance your career, while looking after you along the way with a range of benefits designed with you in mind. Some of our favorites include...\n   \n\n  \n\n* Flexibility to work from home\n* Stock options that ensure your share in our success\n* Extra recharge days on top of your annual vacation\n* Comprehensive relocation support to Estonia or Spain\n* Extensive medical, dental, and vision insurance to ensure you\u2019re feeling great physically and mentally\n* Learning and Development \\& Health and Sports budget that you are free to tailor to your own needs\n* Four weeks of fully paid sabbatical leave after reaching your 5th work anniversary\n\n\n*We are an Equal Opportunities employer committed to a diverse and representative team. Different opinions, per ails":null,"description":"We\u2019re the world\u2019s leading data, insights, and consulting company; we shape the brands of tomorrow by better understanding people everywhere.\n   \n\n  \n\n Worldpanel provides brands and retailers with a unique, 360\\-degree understanding of consumer behaviour across the globe. We are shopper\\-centric, continuously monitoring the purchase and usage behaviour through the largest omnipanel in the world. With unparalleled datasets, pioneering technology and expert analysts, we partner with brands and retailers of all sizes, empowering them to reimagine what\u2019s possible, and change the landscape to create a better, healthier, more sustainable and inclusive world.\n   \n\n  \n\n**Job Details**\n Worldpanel is the global expert in shopper behavior, offering continuous monitoring, advanced analytics and tailored solutions to inspire successful decisions by leading organizations worldwide. Worldpanel turns purchase behavior into a competitive advantage across a diverse range of markets including tech, fashion, telecoms and FMCG.\n   \n\n  \n\n***Numerator***\n*, a data and tech company serving the North American market research space, has combined with\n **Worldpanel** \n , to create a new global consumer data company. This new company forms a powerhouse of technology enabled consumer insights from nearly five billion consumers worldwide, driving innovation and strategic solutions for thousands of customers.*\n*Join us in this groundbreaking venture and be part of a team that shapes the future of market research.*\n**Role\u2019s Mission**\n We\u2019re currently looking for an enthusiastic Data Scientist to join our Data Science team and answer client question through analytical techniques. You\u2019ll work closely to both the commercial team and the operations and global Data Science teams.\n   \n\n  \n\n Our ideal candidate should have a passion for discovering patterns from large data sets and will work with internal and external stakeholders to understand and solve the business problems.\n   \n\n  \n\n If you\u2019re willing to go beyond the obvious, using intelligence, passion, and creativity to inspire new thinking and shape the world we live in, apply for a career that\u2019ll be out of the ordinary by joining us!\n   \n\n  \n\n**Key Outcomes**\n End to end production of the technical analysis in advanced analytics solutions.\n   \n\n  \n\n Support and develop new solutions collaborating with the Global Innovation Team to provide our clients the best answer for their business question.\n   \n\n  \n\n Explain processes and results to clients and internal teams regardless of the technical background of the audience.\n   \n\n  \n\n**Key Capabilities**\n**Your background will ideally look like this\u2026**\n* University Degree (Bachelor\u2019s or Master\u2019s Degree) in Mathematics, Computer Science, Engineering or equivalent quantitative fields.\n* Business proficiency in English (C1 Level Minimum required).\n* At least 5 years of confirmed experience in similar roles \u2013 Marketing Research experience would be a plus.\n* Proficiency in data manipulation, analysis and visualization using R. Additional experience with Shiny and package development desirable.\n* Experience with other data science languages and frameworks (Python\/Spark) as well as coding experience in other languages used across our business (Java, JavaScript, C\\+\\+) desirable\n* Experience working with, and deep understanding of the detail behind relevant modelling techniques \u2013 clustering techniques, GLMs, decision trees, ensembling techniques etc.\n* Great organisational skills with the right level of creativity. Desirable experience working with version control tools (Git, \u2026)\n* Data Base knowledge.\n* Desirable experience in SAS and Power BI or other dashboarding tools.\n\n\n**With the following qualities\u2026**\n* With critical thinking, and demonstrate genuine passion for consumer behaviour.\n* Enjoys actively looking for new and more efficient ways of improving processes, raising standards, reducing errors, and overcoming omissions.\n* Proactive, optimistic, and willing to get involved to achieve the team's goals and objectives.\n* Highly collaborative and adaptable with the ability to work effectively within different cultural and technical environments.\n* Possesses outstanding communication and interpersonal skills to comfortably connect with partners at all levels across the organization and facilitates discussions in a constructive manner.\n* Native or fluent proficiency in English and Spanish.\n\n\n**What's in it for you?**\n* Private health cover.\n* Meal Allowance\n* Access to our 24\/7 employee assistance programme (wellbeing platform)\n* Volunteer Leave (2 days per year)\n* Flexible benefit allowance (annual)\n* Life assurance and income protection\n\n\n**Reasonable Adjustments**\n Kantar is committed to offering equal opportunities to all individuals including during the recruitment process. If you require any reasonable adjustments or assistance, please advise us in advance of your interview so that we can make the necessary arrangements.\n   \n\n  \n\n**Country**\n Spain\n   \n\n  \n\n**Why join Kantar?**\n We shape the brands of tomorrow by better understanding people everywhere. By understanding people, we can understand what drives their decisions, actions, and aspirations on a global scale. And by amplifying our in\\-depth expertise of human understanding alongside ground\\-breaking technology, we can help brands find concrete insights that will help them succeed in our fast\\-paced, ever shifting world.\n   \n\n  \n\n And because we know people, we like to make sure our own people are being looked after as well. Equality of opportunity for everyone is our highest priority and we support our colleagues to work in a way that supports their health and wellbeing. While we encourage teams to spend part of their working week in the office, we understand  under control.\n\n\nMonetary Policy Processes Division (MPPD)\n\n\nMPPD is a new group built as part of the MPT project. We are responsible for designing and overseeing the processes that support monetary policy setting, working in conjunction with the relevant analytical divisions and areas. This means developing organisational and technology\\-based solutions that ensure that MPC decision\\-making is supported in the most effective and efficient way on a sustained basis.\n\n\nJob description\n\n\nWe are looking for an experienced data scientist leader to head our new Data Science and Engineering Team and help shape the strategic direction and delivery of data science across monetary policy. This is an exciting opportunity to build and lead a high\\-performing team and play a key role in modernising our use of data and analytics to support the MPC. The person who takes on this role will have a real opportunity to shape how things are done, making a big difference now and in the future. As the senior manager you will:\n\n\n* Lead the vision and strategy for how data science can support monetary policy\n* Build and manage a diverse team of data scientists\n* Engage with policymakers and economists to understand their needs and ensure solutions are aligned and effective\n* Embed best practices in coding, modelling and documentation while fostering a supportive community\n* Lead innovation through emerging tools, including AI, that can improve our effectiveness and efficiency\n* Link with the Bank\u2019s central technology and data teams to ensure that business needs are continuously catered for\n\nNumber of direct reports: 6\n\n\nRole Requirements\n\n\nWe are seeking someone with deep technical knowledge, experience shaping and delivering impactful data science products and strong leadership skills. People from all backgrounds are welcome\u2014even if you don\u2019t meet every desirable criterion, we value your perspective and interest.\n\n\nEssential \u00b7 Strong technical skills working with modern data platforms and programming languages like R and Python and their data science libraries and packages.\n\n\n* Experience leading and developing a team of data scientists or analysts.\n* Experience leading or overseeing the development, testing and deployment of models and analytical tools, ensuring robustness, risk reduction and alignment with analytics development lifecycle principles.\n* Ability to assess emerging AI tools and integrate them effectively to streamline processes, raise productivity, unlock new insights and increase the impact of analytical work.\n* Strong collaboration skills, including the ability to plan and communicate how data science can benefit a large organisation, work well with others (economists, policy specialists, technical staff), and actively help build a supportive, knowledge\\-sharing data science community.\n\nDesirable\n\n\n* Familiarity with Microsoft Azure and scalable cloud\\-based data platforms.\n* Familiarity with Databricks.\n* Experience delivering the implementation of a new data platform and analytics capabilities within a large or complex organisation.\n* Experience working in partnership with economists or in a policy\\-making environment, with an understanding of how data analytics can support policy analysis.\n* Knowledge of operational risk reduction in the context of analytical workflows and model management.\n**Our Approach to Inclusion**\n\nThe Bank values diversity, equity and inclusion. We play a key role in maintaining monetary and financial stability, and to do that effectively, we believe we need a workforce that reflects the society we serve.\n\n\nAt the Bank of England, we want all colleagues to feel valued and respected, so we're working hard to build an inclusive culture which supports people from all backgrounds and communities to be at their best at work. We celebrate all forms of diversity, including (but not limited to) age, disability, ethnicity, gender, gender er base by understanding client needs and demonstrating how Slack can help achieve their business goals.\n   \n\n  \n\n**Revenue Cloud Product Alignment**\n As a Revenue Cloud Specialist, you will be responsible for implementing and managing Salesforce Revenue Cloud solutions to enhance our sales processes and revenue management. You will work closely with cross\\-functional teams to ensure seamless integration and optimal performance. You will be responsible for Optimizing revenue processes, including CPQ (Configure, Price, Quote) and billing.\n   \n\n  \n\n**Service Cloud Product Alignment**\n As a Service Cloud Specialist, you will be responsible for implementing and managing Salesforce Service Cloud solutions to optimize our customer service processes. You will work closely with various teams to ensure seamless integration and effective use of the platform. You will be responsible for Implementing and configuring Salesforce Service Cloud solutions, optimizing service processes, including case management, knowledge base, and customer portals.\n   \n\n  \n\n**Vertical Alignment**\n This role will either be specifically selling into accounts within the Financial Services Industries which includes Banking, Insurance, and Wealth \\& Asset Management\n ***OR***\n this role will be specifically selling into accounts within the Healthcare and Life Sciences Industry which includes Payers, Providers, MedTech, Pharmaceuticals, and BioTech.\n   \n\n  \n\n**Please Note**\n By applying to the Commercial\/Enterprise Account Executive \\- Specialists Account Executive \\- Financial Services\/Healthcare \\& Life Sciences role posting, recruiters and hiring managers who support multiple cloud offerings across the organization hiring Commercial and Enterprise Account Executives will review your resume. Our goal is for you to apply once and have your resume reviewed by multiple hiring teams. Please note some of these positions may be office\\-based, office\\-flexible or remote depending on the team.\n   \n\n  \n\n**Day to Day**\n**Skills**\n You will be in charge of developing and growing Commercial\n ***OR***\n Enterprise customers. Account Executives plan and engage with prospects, customers and new leads to sell the entire Tableau platform. They build positive, trusted relationships with both key team members and c\\-suite decision makers within their patch, and become naturals at helping customers realize value from their Salesforce investments, particularly on the analytics. You will use your skills to develop opportunities, through both warm leads, existing customers and whitespace prospecting:\n   \n\n  \n\n* Develop and manage sales pipeline, prospect and assess sales and move a large number of transactions simultaneously through the sales pipeline.\n* Engage the partner network throughout the global ecosystem\n* Develop key customer stakeholder relationships and drive customer satisfaction\n* Assist with the development and execution of overall long\\-term strategy for the account, aligned to customer business objectives\n* Coordinate internal resources including product support, customer success, and sales engineering to meet customer business needs\n* Assist with account planning at assigned accounts, coordinating with other sales resources (Salesforce Core AE\u2019s, Prime AE\u2019s, Cloud AE\u2019s, etc.) to ensure strategic alignment\n* Manage sophisticated sales\\-cycles and present to C\\-level executives the value proposition of Tableau platform\n* Define and complete territory \/ account sales plans for assigned territory and then meet and exceed sales goals (quotas) through prospecting, qualifying, managing and closing sales opportunities.\n\n\n**Preferred Qualifications**\n* Commercial: Average of 5\\-10 years of full cycle sales experience, with at least 3 in the field\n* Enterprise: 10 years of full cycle sales experience, at least 5 years in Enterprise Sales\n* Proven experience in managing existing customer accounts to drive upsell\/cross\\-sell opportunities, as well as acquiring new logo accounts OR focusing exclusively on new logos (Hunter role)\n* Ability to build and deliver presentations to your customers\n* Ability to strategize with a large extended team\n* Experience will be evaluated based on the core competencies for the role (e.g. extracurricular leadership roles, military experience, volunteer roles, work experience, etc.)\n\n\n**Working at Salesforce**\n Working at Salesforce isn\u2019t all about selling. It\u2019s also about learning, and we heavily invest in you with a month\\-long immersion and onboarding, including: a week\\-long product bootcamp, mentorship program, weekly coaching and development programs.\n   \n\n  \n\n**Benefits**\n We are pioneers of the Pledge 1% model, providing product, grants and community service to those in need. We are proud to be \\#1 in PEOPLE\u2019s Top 50 Companies that Care, and are on Fortune\u2019s Change the World list.\n   \n\n  \n\n We provide every employee with 7 paid volunteer days off a year, and donation matching for all approved charitable donations.\n   \n\n  \n\n We provide other world\\-leading benefits to all our employees, including;\n   \n\n  \n\n* Health, life insurance, retirement saving plan\n* Monthly wellness allowance\n* Flexible time off \\& leave policies\n* Parental benefits\n* Perks and discounts\n\n\n Accommodations\n   \n\n  \n\n If you require assistance due to a disability applying for open positions please submit a request via this Accommodations Request Form.\n   \n\n  \n\n Posting Statement\n   \n\n  \n\n Salesforce is an equal opportunity employer and maintains a policy of non\\-discrimination with all employees and applicants for employment. What does that mean exactly? It means that at Salesforce, we believe in equality for all. And we believe we can lead the path to equality in part by creating a workplace that\u2019s inclusive, and free from discrimination. Know your rights: workplace discr
