quirements.\n* **MLOps and Deployment:** \n Take ownership of deploying and operationalizing ML models. You will containerize models or use Azure ML endpoints, set up CI\/CD pipelines (using Azure DevOps or GitHub Actions) for automated model training and deployment, and implement monitoring for model performance drift. Ensure that the AI solutions can scale in production and adhere to DevOps best practices for reliability.\n* **Data Pipeline Collaboration:** \n Work closely with Data Engineers to ensure the data needed for AI models is available, reliable, and well\\-prepared. Contribute to data pipeline design for ML \u2013 e.g., help define feature engineering processes or streaming data ingestion for real\\-time inference \u2013 so that models can be trained on and serve high\\-quality data.\n* **Cross\\-Functional Collaboration:** \n Collaborate with Solution Architects (like the ML\/AI Architect) to translate high\\-level architectural designs into concrete implementation tasks. Work alongside other specialists such as data scientists and cloud engineers to build\n **secure, end\\-to\\-end AI solutions** \n that integrate into the client\u2019s ecosystem. This includes participating in code reviews, knowledge sharing, and troubleshooting sessions within the team.\n* **Client Support \\&\u00a0Iteration:** \n Support client teams in adopting and understanding the AI solutions. This could involve preparing technical documentation, demoing functionalities to stakeholders, and iterating on models based on user feedback or changing requirements. Ensure that AI solutions meet responsible AI guidelines and data privacy\/security standards as expected by enterprise clients.\n\n\n  \n\n  \n\n**Qualifikationen**\n* **Experience:** \n 5\\+ years of hands\\-on experience in AI\/ML engineering or data science roles, with a focus on building and deploying solutions (not just research or academic projects). You should have taken multiple ML projects through the full lifecycle leled insight about pricing and demand trends.\n   \n\n  \n\n This is a unique opportunity to join our growing Fintech Foundation team. We\u2019re responsible for optimizing pricing for all ancillary products we sell, balancing customer demand with the financial risks we take on. We help our product teams deliver new fintech products to market faster, respond rapidly to changing market conditions, run continuous champion\\-challenger testing on product construction levers, and maintain our growing portfolio of pricing models across dozens of partners.\n   \n\n  \n\n As a ML engineer you will play a key role in growing our fintech business through delivering and operating innovative pricing solutions at scale across dozens of partners.\n   \n\n  \n\n**What Would Your Day\\-to\\-day Look Like**\n* Implementing automated, reusable ML training pipelines.\n* Build data ETL pipelines including appropriate feature engineering\n* Develop and deploy ML real\\-time pricing solutions to production.\n* Monitor and optimize for low\\-latency and minimal training\/serving skew.\n* Collaborate with data scientists, engineers and product stakeholders to define and implement relevant solutions.\n\n\n**An Ideal Candidate Has**\n* Strong development skills in Python, Scala, SQL.\n* Deep understanding of ML algorithms and frameworks like pandas, sklearn, flyte, TensorFlow etc\n* Familiarity with data modeling, software architecture and distributed data processing tools.\n* Strong analytical and problem solving skills, with attention to detail.\n* Excellent communication and collaboration skills.\n\n\n**Perks and benefits of working with us:**\n* Well\\-funded and proven startup with large ambitions, competitive salary and upsides of pre\\-IPO equity packages.\n* Hopper offers a monthly cash allowance to supplement costs related to private Medical, Dental and\/or Life insurance coverage.\n* Employees in Ireland have the option to contribute to a PRSA (private retirement savings account)   \n\n  \n\n Here are just a few stats that demonstrate the company\u2019s recent growth:\n   \n\n  \n\n Hopper sells billion worth of travel and travel fintech every year. In 2023, over 1\\.3 billion trips were planned through the Hopper app and our HTS partnerships.\n   \n\n  \n\n Our fintech products \u2013 including Price Freeze, Flexibility for Any Reason and Flight Disruption Assistance \u2013 have exceptionally strong CSAT because the terms are always clear, and customers receive instant, no\\-questions\\-asked resolutions.\n   \n\n  \n\n Almost 30% of our app customers purchase at least one fintech product when making a booking; and consumers are 1\\.6x more likely to repurchase if they add fintech to their booking vs if they booked just travel.\n   \n\n  \n\n Given the success of its fintech products, Hopper launched a B2B initiative, HTS (Hopper Technology Solutions), which represents more than 50% of the business.\n   \n\n  \n\n Through HTS, any travel provider (airlines, hotels, banks, travel agencies, etc.) can integrate and seamlessly distribute Hopper\u2019s fintech or travel inventory on their direct channels. As its first HTS partnership, the company partnered with Capital One to co\\-develop Capital One Travel, a new travel portal designed specifically for cardholders. Other HTS partners include Air Canada, Uber, CommBank, Nubank, Flair Airlines with many more in the pipeline.\n   \n\n  \n\n Featured in Apple\u2019s Best of the App Store list of Essential Travel Apps in 2023 and recognized by the likes of Fast Company\u2019s Most Innovative Companies, Hopper has been downloaded over 120 million times and continues to have millions of new installs each month. Hopper is now the \\#3 largest online travel agency in North America and 70% of our app customers are Gen\\-Z and millennials travelers.\n   \n\n  \n\n Hopper has raised over $750 million USD of private capital and is backed by some of the largest institutional investors and banks in the world. gmented generation (RAG) platform across multiple channels; including customer service bots, email and search. In collaboration with ML scientists, we deliver high\\-quality AI products leveraging the latest tools and techniques, and serve them at a scale that most companies can only dream of. We\u2019re passionate about empowering end\\-users to quickly find answers to their questions, and helping our customers make the most of their knowledge base.\n   \n\n  \n\n**We\u2019re looking for a Senior ML engineer to join our team and play a key role in levelling up the RAG platform powering Zendesk!**\n**What You\u2019ll Be Doing**\n* Delivering AI\\-powered capabilities to our customers at Zendesk scale using the latest in LLM technology\n* Working closely with Product Management, ML Scientists and other ML Engineers to define feature scope and implementation strategies\n* Mentoring junior team members, as well as pairing with more experienced colleagues to foster mutual learning\n* Supporting our deployed services to ensure a high level of stability and reliability\n* Contributing to discussions regarding technical design and best practices\n* Writing clean and maintainable code to meet the team\u2019s delivery commitments\n\n\n* Here some of the challenges you will be working on:\n+ How do we best expand our RAG platform to handle new use cases?\n+ How do we optimize our system for both speed and cost\\-efficiency?\n+ How do we incorporate multiple sources of context to improve the accuracy of our generated answers?\n+ How do we make the best use of rapidly evolving LLM technologies?\n+ And many more!\n\n\n**Basic Qualifications**\n**What you bring to the role**\n* 4\\+ years developing machine learning systems in Python\n* Solid understanding of architecture and software design patterns for server\\-side applications\n* Experience with managing and deploying cloud services with a cloud provider (AWS, GCP, Azure)\n* Experience building scalable and stable software ap  minimize downtime or user impact. Furthermore, always knowing how their code performs in production allows teams to move faster and with confidence, driving innovation while maintaining the reliability and efficiency of their systems. We are looking for a software engineer to work on our analysis engine. All profiling data sent to Datadog will be continuously analyzed for problems and opportunities. This includes identifying outliers, pathological patterns, events that are deemed dangerous, subpar performance or simply situations we know can be improved upon or that may have future implications.\n   \n\n  \n\n*At Datadog, we place value in our office culture \\- the relationships that it builds, the creativity it brings to the table, and the collaboration of being together. We operate as a hybrid workplace to ensure our employees can create a work\\-life harmony that best fits them.*\n**What You\u2019ll Do:**\n* Own and evolve the continuous profiler insights and recommendations.\n* Analyze and evaluate the performance of insights and recommendations.\n* Develop new insights and recommendations.\n* Collaborate with various Datadog AI Teams, such as AI Code Generation and Data Science.\n* Collaborate with profiling teams to design and implement innovative product features.\n* Advise on algorithms and techniques that balance the trade\\-offs between statistical accuracy and real\\-world computational constraints.\n\n\n**Who You Are:**\n* You have a deep understanding of statistical methods and classical machine learning techniques.\n* You\u2019ve successfully delivered a customer\\-facing, large\\-scale analysis experience.\n* You care about performance and have experience in measuring and optimizing algorithms and code.\n* You enjoy working in a fast\\-moving, high\\-growth startup environment.\n\n\n*Datadog values people from all walks of life. We understand not everyone will meet all the above qualifications on day one. That's okay. If you\u2019re passionate about technology and want to grow your skills, we encourage you to apply.*\n**Bonus Points:**\n* Experience implementing statistical heuristics and sampling methods.\n* You have hands\\-on experience with generative AI.\n* Proficiency in optimizing the performance of applications, frameworks, or libraries.\n* Java development experience.\n\n\n**Benefits and Growth:**\n* New hire stock equity (RSUs) and employee stock purchase plan (ESPP)\n* Continuous professional development, product training, and career pathing\n* Intradepartmental mentor and buddy program for in\\-house networking\n* An inclusive company culture, ability to join our Community Guilds (Datadog employee resource groups)\n* Access to Inclusion Talks, our Internal panel discussions\n* Free, global mental health benefits for employees and dependents age 6\\+\n* Competitive global benefits\n\n\n*Benefits and Growth listed above may vary based on the country of your employment and the nature of your employment with Datadog.*\n**About Datadog:**\n Datadog (NASDAQ: DDOG) is a global SaaS business, delivering a rare combination of growth and profitability. We are on a mission to break down silos and solve complexity in the cloud age by enabling digital transformation, cloud migration, and infrastructure monitoring of our customers\u2019 entire technology stacks. Built by engineers, for engineers, Datadog is used by organizations of all sizes across a wide range of industries. Together, we champion professional development, diversity of thought, innovation, and work excellence to empower continuous growth. Join the pack and become part of a collaborative, pragmatic, and thoughtful people\\-first community where we solve tough problems, take smart risks, and celebrate one another. Learn more about \\#DatadogLife on Instagram, LinkedIn, and Datadog Learning Center.\n   \n\n  \n\n**Equal Opportunity at Datadog:**\n Datadog is an Affirmative Action and Equal Opportunity Employer and is proud to offer equal employment  similar.\n* Strong communication skills and ability to work across disciplines with ML scientists, engineers, and stakeholders.\n\n\n**Preferred Qualifications**\n* PhD in Computer Science, Machine Learning, Engineering, or a related technical discipline.\n* Experience with multi\\-agent RAG systems or AI agents coordinating workflows for advanced information retrieval.\n* Familiarity with prompt engineering and building evaluation pipelines for generative models.\n* Exposure to Snowflake or similar cloud data platforms.\n* Broader data science experience, including forecasting, recommendation systems, or optimization models.\n* Experience with streaming data pipelines, real\\-time inference, and distributed ML infrastructure.\n* Contributions to open\\-source ML projects or research in applied AI\/LLMs.\n* Certifications in Azure, AWS, or GCP related to ML or data engineering.\n\n\n**Job Title**\n* Once hired this person will have the job title Senior Machine Learning Engineer\n\n\n**Total Rewards**\n At Enable, we\u2019re committed to your professional development and growth. Starting pay is determined by factors like location, skills, experience, market conditions, and internal parity.\n   \n\n  \n\n**Benefits**\n Salary\/TCC is just one component of Enable\u2019s total rewards package. Enable is committed to investing in the holistic health and wellbeing of all Enablees and their families. Our benefits and perks include, but are not limited to:\n   \n\n  \n\n**Paid Time Off:** \n Take the time you need to relax and recharge\n   \n\n  \n\n**Wellness Benefit:** \n Quarterly incentive dedicated to improving your health and well\\-being\n   \n\n  \n\n**Comprehensive Insurance:** \n Health and life coverage for you and your family\n   \n\n  \n\n**Retirement Plan:** \n Build your future with our retirement savings plan\n   \n\n  \n\n**Lucrative Bonus Plan:** \n Enjoy a rewarding bonus structure subject to company or individual performance\n   \n\n  \n\n**Equity Progr ine learning models\n* Experience with AI\/ML frameworks such as TensorFlow, PyTorch, numpy or scikit\\-learn\n* Strong communication and technical writing skills.\n* Familiarity with unit testing, debugging, profiling and performance monitoring in AWS environment.\n* Prior experience with Node.js, building features using REST and\/or GraphQL APIs using Apollo preferred\n* Prior knowledge or ability to quickly learn developing in a MLOps environment (MLflow or similar) preferred.\n* Ability to work a hybrid schedule \\- Monday\/Friday WFH, Tuesday \\- Thursday, in office\n\n\n**What We Offer:**\n* Negotiable base salary \\+ annual bonus\n* Generous equity grant, become an owner in our company!\n* A comprehensive benefits package\n* Flexible PTO and hybrid work schedules\n* Work from home stipend\n* Hubs in Los Angeles, Toronto, and Raleigh with hybrid work schedules with lunch provided for in\\-office days\n* Company events like BBQs and team\\-building activities, both in\\-person and virtual\n* Fast\\-paced, collaborative, and dynamic work environment\n* Opportunities for growth and career advancement\n* Chance to work with cutting\\-edge technology and innovative solutions\n* The chance to get in on the ground floor and build something truly groundbreaking for ourselves and our amazing customers\n\n\n**About BuildOps**\n Join BuildOps, the largest commercial trade platform in the country, as we transform the multi\\-billion dollar commercial contracting industry!\n   \n\n  \n\n We\u2019re not just talking incremental improvements\u2014we\u2019re talking a full\\-scale revolution, empowering the hardworking heroes who build and maintain the infrastructure that keeps our world running. See why contractors choose Buildops here.\n   \n\n  \n\n This is your chance to be part of a rocketship. We\u2019re fresh off a $1 billion valuation and a $127M Series C funding round (part of over $275M raised to date) led by industry\\-leading investors like Meritech Capital, BOND, ct and engineering to embed intelligent behaviors into our no\\-code form builder. This is not a research job or a sandbox role \\- it\u2019s a real opportunity to push AI into production at scale.\n   \n\n  \n\n What you\u2019ll do\n   \n\n  \n\n* Build and tune vector\\-based retrieval pipelines using OpenAI embeddings and Azure AI Search\n* Design prompt strategies and agents to translate parsed PDF data into form component schemas\n* Fine\\-tune LLMs for structured output generation with low\\-latency performance in mind\n* Lead the development of an RLHF loop that incorporates builder UI feedback and audit data\n* Help architect systems that blend traditional APIs and probabilistic inference reliably\n* Work alongside full\\-stack and platform engineers to get it all running in production\n* Stay plugged into the latest model capabilities, and make smart calls on what to adopt\n\n\n Tech you\u2019ll use\n   \n\n  \n\n* Azure AI Studio, Azure OpenAI, GPT\\-4o\n* Python (for agents, functions, orchestration), .NET 8 (for integration layers)\n* Azure AI Search, CosmosDB, MSSQL\n* Kubernetes (AKS), Azure Blob, Octopus for CI\/CD\n* Extend.ai for structured PDF parsing\n\n\n What we\u2019re looking for\n   \n\n  \n\n* 5\\+ years in applied ML, including experience with retrieval, embeddings, and prompt engineering\n* Strong Python skills and familiarity with production\\-grade ML pipelines\n* Experience designing and tuning RAG workflows with hybrid search\n* Familiarity with RLHF and fine\\-tuning on structured JSON output\n* Solid grasp of system\\-level thinking\u2014how to bring ML into product environments cleanly\n\n\n Nice to have .NET understanding, especially for integration and orchestration layers\n   \n\n  \n\n What success looks like in 6 months\n   \n\n  \n\n* You\u2019ve shipped a working vector search \\+ RAG pipeline integrated into our form builder\n* You\u2019ve scoped and kicked off our first LLM fine\\-tuning cycle\n* We\u2019re collecting human icators that reflect Grammarly's product quality and user engagement, directly supporting the mission of rapid product iteration based on solid data.\n* Examine the effects of user engagement in product experiments, aiding teams in making informed decisions.\n* Collaborate with Product and Engineering teams to set up, test, and evaluate hypotheses. This central role in testing and iteration is vital for the team's product development strategy.\n* Collaborate with other Data Scientists to continue enhancing the methodologies and practices used across the team and leveraging the newest technological developments in the industry.\n\n\n**Qualifications**\n* Holds a PhD or Master\u2019s degree in a quantitative field.\n* Has 5\\+ years of work experience in Data Science.\n* Has a strong understanding of statistical concepts with practical application in business environments, including A\/B testing, offline evaluations, and metric validation.\n* Knowledgeable in standard regression and classification methods, beneficial for developing and validating metrics.\n* Experienced in A\/B testing and other measurement strategies to discern correlational and causal relationships among variables.\n* Skilled in SQL, Python, PySpark, etc., ensuring accurate and efficient data retrieval for analysis.\n* Has a self\\-starting growth mindset and strong communication skills, translating technical insights into impactful business recommendations.\n* Can collaborate with cross\\-functional teams, such as Engineering, Product, and Data Platforms, to define metrics that align with the organizational vision and measure performance.\n* Embodies our EAGER values\u2014is ethical, adaptable, gritty, empathetic, and remarkable.\n* Is inspired by our MOVE principles: move fast and learn faster; obsess about creating customer value; value impact over activity; and embrace healthy disagreement rooted in trust.\n\n\n**Support for you, professionally and personally**\n* Professional growth: We believe cts.\n* Understand challenges and coming up with creative solutions using available technology.\n* Create important documents that outline our project needs and specifications.\n* Keep track of project tasks and ensuring progress is made.\n* Test new developments to ensure they work as intended\n* Develop training materials and leading sessions to help others understand our applications\n* Monitor support tickets to identify trends and help resolve issues quickly.\n\n\n**We offer you:**\n We offer more than just a job. We put people first and inspire you to become the best version of yourself.\n   \n\n  \n\n* Great benefits including salary and a comprehensive social benefits package. We have one of the best pension plans on the market, as well as flexible remuneration with tax advantages: health insurance, restaurant card, mobility plan, etc.\n* Personal and professional growth through ongoing training and constant career opportunities reflecting our conviction that people are our most important asset.\n* Hybrid working environment with flexible working scheme. Our state\\-of\\-the\\-art campus is dog friendly and equipped with a medical center, canteen and areas to co\\-create network and chill!\n* Recreation activities such as yoga, Zumba, etc. and a wide range of volunteering activities.\n\n\n Join our global team of IT professionals at Nestl\u00e9, driving daily innovation and leveraging cutting\\-edge technologies to address digital opportunities. Grow professionally in a dynamic and impactful environment, collaborating with business partners worldwide to deliver integrated technology solutions!\n   \n\n  \n\n**What will make you a great fit?**\n* You have strong curiosity on new tech envolvement, like GenAI, ML, etc.. and you have already worked with Snowflake and or Machine Learning and AI.\n* You have proven knowledge on Customer Service (SAP SD)\n* You have proven experience working directly with a variety of stakeholders in matrix organization to understa y!\n   \n\n  \n\n**What You\u2019ll Be Doing**\n* Collaborate with performance marketing teams in coming up with data solutions to support the optimization of marketing campaigns, budgets and results;\n* Use recommendation systems and clustering to uncover the most effective combinations of search terms, keywords, ad copies, and landing pages that maximize effectiveness of our paid search channel;\n* Scale new channels and improve targeting and bidding strategies by using regression models to assign predictive weights to funnel events;\n* Lead the rollout of LTV models and use early insights to guide marketing investments, product decisions, and uncover high\\-leverage opportunities across the business \\- including CRM, Customer Support, Refer\\-a\\-Friend, and more \\- while proactively sharing learnings to inform cross\\-functional strategy and prioritization;\n* Design and analyze A\/B tests to measure marketing effectiveness, applying advanced methods like causal inference and geo\\-lift testing to quantify incremental ROI;\n* Work closely with the Data Engineering team in the creation of scalable data pipelines while guaranteeing an optimal evolution of our ETL processes, as well on the adoption of new tools and frameworks;\n* Contribute to cross\\-company initiatives in alignment with our data organization\u2019s vision;\n* Support proactively the application of marketing mix, attribution and predictive models in performance marketing channels.\n\n\n**What You Need To Succeed**\n* Solid experience as a Data Scientist delivering business insights and building data products;\n* Previous experience developing and deploying machine learning models;\n* Experience with experimentation (design and evaluation of A\/B tests);\n* Experience working in Marketplaces and\/or digital businesses environments, in the context of performance marketing;\n* Strong coding skills in SQL and Python;\n* Creative mindset and proactive attitude towards the creation and evaluation of new solutions;\n* Strong curiosity, problem solving and problem finding skills;\n* Advanced written and verbal communication skills in English.\n\n\n**Nice To Have**\n* Knowledge of bidding, incrementality, attribution or MMM;\n* Previous experience with causal inference techniques (e.g. causal impact, synthetic control, difference in differences, etc.);\n* Previous experience with Databricks, Snowflake, Looker;\n* Previous experience with Apache Spark;\n* Knowledge of data orchestration tools (e.g. dbt and Airflow).\n\n\n**Why You\u2019ll Love It At Preply**\n* An open, collaborative, dynamic and diverse culture;\n* A generous monthly allowance for lessons on Preply.com, Learning \\& Development budget and time off for your self\\-development;\n* A competitive financial package with equity, leave allowance and health insurance;\n* Not in Barcelona? We offer an attractive relocation package to join us in our Preply Barcelona Hub\n* Access to free mental health support platforms;\n* Access to Gympass\\-partnered wellness and gym centers throughout Spain to promote and support well\\-being and physical health;\n* The opportunity to unlock the potential of learners and tutors through language learning and teaching in 175 countries (and counting!).\n\n\n**Our Principles**\n* Care to change the world \\- We are passionate about our work and care deeply about its impact to be life changing.\n* We do it for learners \\- For both Preply and tutors, learners are why we do what we do. Every day we focus on empowering tutors to deliver an exceptional learning experience.\n* Keep perfecting \\- To create an outstanding customer experience, we focus on simplicity, smoothness, and enjoyment, continually perfecting it as every detail matters.\n* Now is the time \\- In a fast\\-paced world, it matters how quickly we act. Now is the time to make great things happen.\n* Disciplined execution \\- What makes us disciplined is the excellence in our execution. We set clear goals, focus on es the re\\-usability of marketing data across our marketing systems and analytics platforms, which underpins both Burberry\u2019s personalisation capabilities and enables increased effectiveness of marketing campaigns and investments. They will be responsible for shaping and managing a prioritised plan around evolving the data quality in this space, and interact daily with marketeers, data scientists and data architects to ensure suitability and availability of data. They will also own the content of the Enterprise Data Catalogue for marketing data domain and will be using our Data Quality \/ Data Observability tooling to ensure quality of Data Products they own\n\n**RESPONSIBILITIES**\n--------------------\n\n\n* Accountable for reliability and availability of Marketing data across platforms, available as products on our Analytics Platform \u2013 both for marketing content and campaigns.\n* Accountable for marketing data processes \\& onboarding on to Analytics Platform.\n* Engagement role between functions and departments to lead \\& coordinate marketing data processes and partner with technical teams and agencies to agree and govern marketing data lineage.\n* Delivery and execution of marketing data feed for all marketing channels.\n* Works with business partners to define and establish data quality rules, definitions and strategy consistent with division and organizational strategies and goals for new and legacy data feeds.\n* Ensure Data Quality rules are captured within our Data Catalogue \\& Data Quality\/Observability tooling,identified DQ issues are resolved within agreed SLAs and relevant audiences are informed through our Data Catalogue channels.\n* Collaborates with Product Managers, Data Scientists and Data Analysts to ensure data quality and availability\n* Focuses with Data Science and Technology Teams on driving automated tagging of marketing data where required\n* Plays key role in ensuring marketing data is available, well curated in catalogue tools, understood and certified, enabling and uncovering further business opportunities related to marketing data\n* Advocating for and supporting active Data Governance within the Marketing Domain\n* Owns the roll out of Data Catalogue to marketing communities and owns Marketing Data Domain within the Data Catalogue\n**PERSONAL PROFILE**\n--------------------\n\n\n* Experience in classifying marketing \\& campaign content using Digital Asset Management tools\n* Awareness of automated tagging approaches\n* Familiar with and able to apply in practice data quality rules and data governance procedures \u2013 experience in using DQ\/DO Tool will be an advantage\n* Understanding of audience management\n* Understand business needs within marketing domain and can suggest and take actions to accommodate\n* Familiar with marketing taxonomy and measurement from different digital and offline marketing channels\n* Capture, analyse and document requirements while supporting the communication and delivery of requirements with relevant stakeholders\n* Experience in common marketing channels including google marketing platform \\& major global and apac paid platforms such as meta, tiktok, naver etc\n* Has a good understanding of marketing attribution and metrics from direct platforms and those sourced via tools such as google analytics or snowplow\n* Have experience with platform API and can navigate platforms for definitions, data discovery\n* Have exposure with media spend planning process and understanding of analytics models for budgeting\n* Previous experience in assessing the success of marketing campaign using analytical methods\n* Data, data lineage and data usage in systems familiarity preferred\n* System architecture aware\n* Affinity and interest in analytics and analytics tools\n* Confident in using SQL (medium level minimum) \u2013 hands on\n* Ability to visualise data flows\n* Power BI \/ other visualisation tools knowledge at the user level preferred\n* Familiar with Da  observability across the stack\n* Collaborate across teams to ship systems that are fast, resilient, and developer\\-friendly\n* Help define and evolve backend best practices as we scale the team\n\n**Location:**\n\n\nThis is a **hybrid role**, and we ask that you work from our **Canary Wharf office 3 days per week**.\n\n**Who You Are**\n===============\n\n\nYou\u2019re an ambitious and entrepreneurial engineer who wants to help build something iconic. You\u2019re motivated by impact, not ego. You move quickly, sweat the details, and love working with others who do the same.\n\n**We\u2019re looking for:**\n\n* 5\\+ years of experience building production\\-grade systems\n* Experience working in early\\-stage startups or high\\-growth environments\n* Expertise in the Node.js ecosystem\n* Strong understanding of backend architecture and scalable system design\n* Deep experience with AWS and infrastructure\\-as\\-code (ideally with TypeScript CDK)\n* Fluency with relational databases and data modeling\n* A clear communicator\u2014written, visual, and verbal\n* Self\\-directed and comfortable in a high\\-autonomy, low\\-ego culture\n\n**Bonus points for:**\n\n* Experience with NestJS or similar backend frameworks\n* Familiarity with GraphQL APIs\n* Knowledge of document databases like MongoDB or DynamoDB\n* Exposure to frontend frameworks (Vue or React)\n\n**Our Stack**\n=============\n\n* **Frontend:** Vue, TypeScript\n* **Backend:** Node.js, NestJS, GraphQL\n* **Infra:** AWS, TypeScript CDK, Docker\n* **Mobile:** Native iOS (Swift), Native Android (Kotlin) with shared KMP layer\n\n**Why Tilt**\n============\n\n* You\u2019ll be joining a mission\\-driven team backed by world\\-class investors (TechCrunch)\n* You\u2019ll own meaningful systems from day one, with real scope and autonomy\n* You\u2019ll work alongside curious, kind, and wickedly smart teammates\n* You\u2019ll help redefine how millions of people shop online\n\n\nCurious what it\u2019s like to work at Tilt? Start here.  \n\nOr just download the app on the UK App Store and see for yourself.\n\n\nCompensation Range: \u00a380K \\- \u00a3115K","company_industry":null,"company_url":"https:\/\/uk.indeed.com\/cmp\/Tilt","company_logo":null,"company_url_direct":null,"company_addresses":"Portland","company_num_employees":"51 to 200","company_revenue":null,"company_description":null,"skills":null,"experience_range":null,"company_rating":null,"company_reviews_count":null,"vacancy_count":null,"work_from_home_type":null,"search_term":"Data scientist","search_location":"London, UK","job_hash":"c7fa4989d744cd8ecb62a08864c568fd","Is_Junior_AI_Job":"No","Country":"UK"},{"id":"in-57144e00b701bc1a","site":"indeed","job_url":"https:\/\/uk.indeed.com\/viewjob?jk=57144e00b701bc1a","job_url_direct":"https:\/\/jobs.ashbyhq.com\/trainline\/0e699880-ac27-4824-af8e-7d275b53b0c8","title":"Data Analyst - Product","company":"Trainline","location":"London, ENG, GB","date_posted":"2025-07-05","job_type":"fulltime","salary_source":null,"interval":null,"min_amount":null,"max_amount":null,"currency":null,"is_remote":false,"job_level":null,"job_function":null,"listing_type":null,"emails":null,"description":"Location\n\n\nLondon\nEmployment Type\n\n\nFull time\nLocation Type\n\n\nHybrid\nDepartment\n\n\nTechnology\nData\n\n\nCompensation\n\n\n\u00a350K \u2013 \u00a360K\n\n\n\nThe top end of the starting salary range may not always be the top end of our banding. If you're unsure, you can check with one of our recruiters.\nOverview\n\n\nApplication\n\n**About us:**\nWe are champions of rail, inspired to build a greener, more sustainable future of travel. Trainline enables millions of travellers to find and book the best value tickets across carriers, fares, and journey options through our highly rated mobile app, website, and B2B partner channels.\n\n**Great journeys start with Trainline** \n\n\nNow Europe\u2019s number 1 downloaded rail app, with over 125 million monthly visits and \u00a35\\.9 billion in annual ticket sales, we collaborate with 270\\+ rail and coach companies in over 40 countries. We want to create a world where travel is as simple, seamless, eco\\-friendly and affordable as it should be.\n\n\nToday, we're a FTSE 250 company driven by our incredible team of over 1,000 Trainliners from 50\\+ nationalities, based across London, Paris, Barcelona, Milan, Edinburgh and Madrid. With our focus on growth in the UK and Europe, now is the perfect time to join us on this high\\-speed journey.\n\n**Introducing Data Analytics at Trainline** \n\n\nData Analytics is central to how we build products, delight our customers and grow our business. Our Data Analysts are embedded across cross\\-functional teams which exist across product and marketing. They work closely with Product Managers, Software Engineers and Commercial and partner directly with Embedded Data Scientists and wider data functions. They have a high degree of autonomy and are empowered to drive the success of their teams by enabling the build, measure, learn cycle.\n\n\nAs a Data Analyst you will be involved in driving insights into product usage, user monetisation and user behaviour to enable us to set an impactful Product strategy and build the right features for our users. You\u2019ll create focus and accountability in teams by setting metrics and goals, ensure we\u2019re learning as we progress through experimentation and ensure we\u2019re feeding insights back in to future decision making. Ultimately this will require a complete obsession with driving impact within the product teams, drawing on a broad range of analytical and statistical techniques to unlock the most benefit.\n\n\nData Analytics exists within the wider data organisation as part of the tech org and is complemented by Data Science, Machine Learning, Data Engineering, Business Intelligence and Data Product Management. This growing and dynamic data team has an outsized impact on the business outcomes and will provide the opportunity for growth and development for ambitious Data Analysts.\n\n**As a Data Analyst at Trainline, you will\u2026** \n\n\nAs a Data Analyst you will be responsible for the full feature life cycle in product teams. You\u2019ll work autonomously with PM to:\n\n* Actively drive ideation and design of new feature releases through deep dives into user behaviour\n* Influence roadmap prioritisation through opportunity sizing\n* Ensure we have the right data tracked to understand product usage\n* Support product experiments, launches, growth through data\\-driven decision making while keeping the team accountable and impactful Understand and deep dive where needed into experimentation results\n* Put together dashboards to enable the teams to track the north star metrics for team success\n* Define goals in your teams to create the right incentives and accountability in Product teams whilst hustling with your team to hit these ambitious objectives\n\n**We'd love to hear from you if you have...** \n\n* 2\\+ years proven experience using analytics to drive business decisions\n* Ability to distil and communicate results of complex analysis clearly and effectively to all levels including senior management\n* Experience of Product engagement evaluation and measurement of success. For example, running AB testing to evaluate product effectiveness or using front end data to quantify the effectiveness of new features and how it changes user engagement\n* Ability to navigate data sets of varying complexity\/ambiguity and conduct analysis to derive clear insights and actionable results\n* Strong PowerPoint and presentation\/communication skills\n* Strong data visualisation skills using tools like Tableau, Spotfire, Power BI etc.\n* Strong SQL skills required\n* Experience in Python with predictive modelling, regression techniques as well as wider techniques like clustering \/ random forest is desirable\n* Tech Stack: SQL, Python, R, Tableau, AWS Athena \\+ More!\n\n**More information:**\n\n\ mplete assignments. They will train, guide and coach less experienced specialists and provide information affecting long term profits, organisational risks and strategic decisions..\n* Advise key stakeholders, including functional leadership teams and senior management on functional and cross functional areas of impact and alignment.\n* Manage and mitigate risks through assessment, in support of the control and governance agenda.\n* Demonstrate leadership and accountability for managing risk and strengthening controls in relation to the work your team does.\n* Demonstrate comprehensive understanding of the organisation functions to contribute to achieving the goals of the business.\n* Collaborate with other areas of work, for business aligned support areas to keep up to speed with business activity and the business strategies.\n* Create solutions based on sophisticated analytical thought comparing and selecting complex alternatives. In\\-depth analysis with interpretative thinking will be required to define problems and develop innovative solutions.\n* Adopt and include the outcomes of extensive research in problem solving processes.\n* Seek out, build and maintain trusting relationships and partnerships with internal and external stakeholders in order to accomplish key business objectives, using influencing and negotiating skills to achieve outcomes.\n\n\nAll colleagues will be expected to demonstrate the Barclays Values of Respect, Integrity, Service, Excellence and Stewardship \u2013 our moral compass, helping us do what we believe is right. They will also be expected to demonstrate the Barclays Mindset \u2013 to Empower, Challenge and Drive \u2013 the operating manual for how we behave.","company_industry":"Banks And Financial Services","company_url":"https:\/\/uk.indeed.com\/cmp\/Barclays","company_logo":"https:\/\/d2q79iu7y748jz.cloudfront.net\/s\/_squarelogo\/256x256\/76b365e481c96410a45876ea3fcf78d9","company_url_direct":"https:\/\/home.barclays\/","company_ ntextual data, and ensuring our AI outputs are accurate, relevant, and actionable for financial professionals.\n \n\n\n\n  \n\n\n\n\n\n You\u2019ll work closely with engineers, our product manager, and the CEO in a collaborative, fast\\-paced environment where your contributions directly shape the user experience and product direction.\n \n\n\n\n  \n\n\n\n\n\n**The admin details:** \n\n\n\n\n This is a\n **part time role,** \n expected to be 2\\-3 days a week.\n \n\n\n\n  \n\n\n\n\n\n This will require some\n **on\\-site** \n work, with a minimum of 1 day a week (we are open to discussions on this).\n \n\n\n\n  \n\n\n\n\n\n The day rate is\n **\u00a3550 \\- \u00a3600** \n .\n \n\n\n\n  \n\n\n\n\n\n**What you\u2019ll do:** \n\n\n\n* Design, test, and iterate on prompts to optimise LLM performance in financial analysis and decision\\-making contexts.\n* Develop strategies for structuring and contextualizing data to improve LLM output quality.\n* Collaborate with engineering teams to integrate LLMs into our real\\-time analytics platform.\n* Define workflows for prompt evaluation, versioning, and performance tracking.\n\n\n\n  \n\n\n\n\n\n**What we\u2019re looking for:** \n\n\n\n* 3\\+ years of experience in data science, NLP, or applied machine learning.\n* Hands\\-on experience working with LLMs (e.g., OpenAI, Anthropic, Cohere, Hugging Face) and prompt design.\n* Strong Python skills and familiarity with data science and NLP libraries.\n* A strategic mindset for data structuring and user\\-centric AI design.\n* Excellent communication skills and a collaborative approach to problem\\-solving.\n\n\n\n  \n\n\n\n\n\n**Why Birchstone:** \n\n\n\n* Work from our modern Moorgate office with free hot drinks, a relaxed atmosphere, and a collaborative team.\n* Competitive salary, 33 days holiday (including bank holidays), and comprehensive health and wellness benefits.\n* A culture that values inclusion, creativity, and continuous learning.\n\n\n\n  \n\n\n\n\n\n**Company Benefits** \n\n\n\n* Hybrid working (3 days a week in our Moorgate office)\n* 33 days holiday incl. Bank Holidays (\\+1 for your birthday)\n* Comprehensive health and wellness benefits\n* Culture that values growth and collaboration\n* Contemporary office with amenities (free hot drinks, communal lounge areas)\n\n\n\n  \n\n\n\n\n\n**Interview Process** \n\n\n\n1. First stage interview with our Hiring Manager and Senior Engineer over MS Teams (30 mins)\n2. Second stage interview with our CEO over MS Teams (30 mins).","company_industry":"Financial Services","company_url":"https:\/\/uk.linkedin.com\/company\/birchstonemarkets","company_logo":"https:\/\/media.licdn.com\/dms\/image\/v2\/D4E0BAQHY_p0AyWdnMw\/company-logo_100_100\/company-logo_100_100\/0\/1701166899395\/birchstonemarkets_logo?e=2147483647&v=beta&t=Zvmli6hRCo5ppgvd9xnQ58u-80ZrMcR_-WEqUKL3h8M","company_url_direct":null,"company_addresses":null,"company_num_employees":null,"company_revenue":null,"company_description":null,"skills":null,"experience_range":null,"company_rating":null,"company_reviews_count":null,"vacancy_count":null,"work_from_home_type":null,"search_term":"Data scientist","search_location":"London, UK","job_hash":"85a5e0154b156b1a4fa7f45cb687bf3b","Is_Junior_AI_Job":"Uncertain","Country":"UK"},{"id":"li-4220977704","site":"linkedin","job_url":"https:\/\/www.linkedin.com\/jobs\/view\/4220977704","job_url_direct":"https:\/\/jobs.ashbyhq.com\/deliveroo\/8ac468a3-cfa7-49a4-a71a-0d57f78f01cf?utm_source=LinkedInPaid&urlHash=nDQh","title":"Data Scientist","company":"Deliveroo","location":"London, England, UK","date_posted":null,"job_type":"fulltime","salary_source":null,"interval":null,"min_amount":null,"max_amount":null,"currency":null,"is_remote":false,"job_level":"entry level","job_function":"Engineering and Information Technology","listing_type":null,"emails":null,"description":"**The Data \\& Science Org**\n At Deliveroo we have an outstanding data science organisation, with a mission to enable the highest quality human and machine decision\\-making. We work throughout the company \\- in product, business and platform teams \\- using analysis, experimentation, causal inference and machine learning techniques. We are uniquely placed to use data to help make better decisions and improve data literacy across Deliveroo.\n   \n\n  \n\n Data Scientists at Deliveroo report into our data science management team, and we have a highly active data science community, with guest lecturers, study groups, mentorship programmes, a robust technical review process, and plenty of opportunities to learn new things. Data Scientists can equally progress as technical leads (individual contributors) and as people managers.\n   \n\n  \n\n Our data scientists come from all kinds of backgrounds but have excellence in common. Many are formally trained in data science, many are not. We celebrate difference and have a dedicated data science diversity committee.\n   \n\n  \n\n As a Data Scientist At Deliveroo, Your Main Goal Is To Maximise Business Impact Within One Of Many Business Areas. You Will Help Answer Questions Like\n   \n\n  \n\n* Which markets\/cities should we enter next?\n* How can we incentivise good rider behaviour?\n* What is the impact of exclusive deals we have with restaurants?\n* How do we optimise our compensation policy to keep our customers happy and ordering with Deliveroo?\n* What are the trade\\-offs we face when choosing between growth and profitability? How should we decide between them?\n* How much should our pricing vary by distance and by market?\n* What is the optimum selection and variety of restaurants in a particular area?\n* How do we adapt our consumer app to better suit grocery shoppers?\n\n\n The work you will do will have a direct, measurable impact on the bottom line of the company.\n   \n\n  \n\n**Requirements**\n* A solid grounding in SQL (and preferably Python)\n* Experience conducting A\/B experiments\n* Great communication skills \\- in person, in ur pricing vary by distance and by market?\n* What is the optimum selection and variety of restaurants in a particular area?\n* How do we adapt our consumer app to better suit grocery shoppers?\n\n\n The work you will do will have a direct, measurable impact on the bottom line of the company.\n   \n\n  \n\n**Requirements**\n* 6\\+ years experience in Data Science (or similar) roles.\n* Great communication skills \\- in person, in writing, in code; to technical and non\\-technical audiences\n* A problem solver with a deep analytical mindset\n* Ability to think creatively and insightfully about business problems\n* A critical thinker with very strong attention to detail\n* Proficiency with analytical tools like R\/Python and familiarity with SQL\n* A pragmatic, flexible approach, where you most care about achieving impact\n* Excellent people skills \u2014 you'll be meeting with stakeholders to translate business needs into data science problems\n\n\n At Deliveroo these are just some of the tough problems we are solving \\- and there is no challenge that cannot be yours. The scope for growth and personal impact is enormous.\n   \n\n  \n\n**Why Deliveroo**\n Our mission is to transform the way you shop and eat, bringing the neighbourhood to your door by connecting consumers, restaurants, shops and riders. We are transforming the way the world eats and shops by making access to food and products more convenient and enjoyable. We give people the opportunity to buy what they want, as they want it, when and where they want it.\n   \n\n  \n\n We are a technology\\-driven company at the forefront of the most rapidly expanding industry in the world. We are still a small team, making a very large impact, looking to answer some of the most interesting questions out there. We move fast, value autonomy and ownership, and we are always looking for new ideas.\n   \n\n  \n\n**Workplace \\& Benefits**\n At Deliveroo we know that people are the heart of the business and we prioritise t s and product developers to better understand business requirements and deliver end product to the clients\n   \n\n  \n\n Implement and test the researched fixed income models using the risk research data\n   \n\n  \n\n Liabilities and probabilities calculations\n   \n\n  \n\n**Requirements**\n Ability to come up with sound research designs and make methodological choices to address business problems with appropriate statistical and machine learning models\n   \n\n  \n\n 3\\+ years of experience as a data scientist, quantitative researcher, quantitative analyst or another relevant role\n   \n\n  \n\n Degree in Applied Mathematics, Computer Science, Financial Engineering, Technology or Engineering\n   \n\n  \n\n Knowledge of probability theory, inferential statistics, machine learning, Bayesian statistics, linear algebra, and numerical methods\n   \n\n  \n\n Experience with statistical and machine learning models, such as regression\\-based models (e.g., logistic regression, linear regression, negative binomial regression), tree\\-based models (e.g., random forests), support vector machines, PCA, clustering models, matrix factorization, deep learning, etc\n   \n\n  \n\n Experience using statistical and machine learning models to contribute to company growth efforts, impacting revenue and other key business outcomes\n   \n\n  \n\n Advanced understanding of Python and the machine learning ecosystem in Python (Numpy, Pandas, Scikit\\-learn, LightGBM, PyTorch)\n   \n\n  \n\n Knowledge of SQL and experience with relational databases\n   \n\n  \n\n Agile, action\\-oriente\n   \n\n  \n\n**Nice to have**\n Apache Spark\n   \n\n  \n\n Experience working in cloud platforms (AWS, GCP, Microsoft Azure)\n   \n\n  \n\n Relevant knowledge or experience in the gaming industry\n   \n\n  \n\n**Benefits**\n Quarterly bonuses\n   \n\n  \n\n We have core hours of 10am\\-3pm in a local timezone, but flexible hours outside of this\n   \n\n  \n\n Top\\-of\\-the\\-line equipment\n   \n\n  \n\n Referral bonuses\n   \n\n  \n\n 28 days paid annual leave\n   \n\n  \n\n Annual company retreat\n   \n\n  \n\n Highly talented, dependable co\\-workers in a global, multicultural organisation\n   \n\n  \n\n Payment via DEEL, a world class online wallet system\n   \n\n  \n\n Our teams are small enough for you to be impactful\n   \n\n  \n\n Our business is globally established and successful, offering stability and security to our Team Members\n   \n\n  \n\n**Our Mission**\n Our mission is to be an everyday entertainment platform for everyone\n   \n\n  \n\n**Our Operating Principles**\n* Create Value for Users\n* Act in the Long\\-Term Interests of Sporty\n* Focus on Product Improvements \\& Innovation\n* Be Responsible\n* Preserve Integrity \\& Honesty\n* Respect Confidentiality \\& Privacy\n* Ensure Stability, Security \\& Scalability\n* Work Hard with Passion \\& Pride\n\n\n**Interview Process**\n Remote video screening with our Talent Acquisition Team\n   \n\n  \n\n Offline Take home assignment\n   \n\n  \n\n Remote video interview with Team Members (60 Mins)\n   \n\n  \n\n Final discussion with the hiring manager (60 mins).\n   \n\n  \n\n**Post Interview Process**\n Feedback call on successful interview\n   \n\n  \n\n Offer released followed by contract\n   \n\n  \n\n ID Check Via Zinc \\& 2 references from previous employers\n   \n\n  \n\n**Working at Sporty**\n The top\\-down mentality at Sporty is high performance based, meaning we trust you to do your job with an emphasis on support to help you achieve, grow and de\\-block any issues when they're in your way.\n   \n\n  \n\n Generally employees can choose their own hours, as long as they are collaborating and doing stand\\-ups etc. The emphasis is really on results.\n   \n\n  \n\n As we are a highly structured and established company we are able to offer the security and support of a global business with the allure of a startup environment. Sporty is independently managed and financed, meaning we don\u2019t iness decisions.\n* Analyze large, complex data sets to derive actionable insights and create clear, informative visualizations.\n* Collaborate with cross\\-functional teams to understand business needs and provide data\\-driven solutions and recommendations.\n* Continuously improve existing machine learning models and introduce innovative solutions that add value to the company's services.\n* Ensure data quality and integrity throughout the data lifecycle.\n* Stay informed on new technology trends and how they can be leveraged within the company.\n\n\n Key Skills\n   \n\n  \n\n* Proficiency in R programming language with hands\\-on experience in data analysis and model building.\n* Strong understanding of machine learning, statistical analysis, and data mining techniques.\n* Excellent problem\\-solving skills with the ability to handle multiple tasks under tight deadlines.\n* Strategic thinker with outstanding communication skills, capable of conveying complex data insights in a clear and effective manner.\n* Thorough knowledge of data manipulation and extraction techniques.\n\n\n This is a full\\-time, permanent position. If you are looking to advance your career in a challenging yet rewarding environment, you might be the ideal candidate for this role.\n   \n\n  \n\n Apply Now","company_industry":"Staffing and Recruiting","company_url":"https:\/\/uk.linkedin.com\/company\/oliver-james-","company_logo":"https:\/\/media.licdn.com\/dms\/image\/v2\/C4E0BAQG1lK8myD13OQ\/company-logo_100_100\/company-logo_100_100\/0\/1656939133952\/oliver_james__logo?e=2147483647&v=beta&t=U5FfweYY2T1YevcOvl-fZye-se19q9emgIXBdwhatOA","company_url_direct":null,"company_addresses":null,"company_num_employees":null,"company_revenue":null,"company_description":null,"skills":null,"experience_range":null,"company_rating":null,"company_reviews_count":null,"vacancy_count":null,"work_from_home_type":null,"search_term":"Data scientist","search_location":"Manchester, UK","job_hash":"487ab3e6da2500 nities for a range of career paths whether it is technical excellence, technical leadership or management roles.\n   \n\n  \n\n We are a friendly team with a number of modelling excellence centres in the UK, Poland and India. We operate without divisions as One Jacobs, with management practices and systems designed to take down regional barriers and encourage cross\\-office working.\n   \n\n  \n\n Our Transport Team, here at Jacobs has developed a strong data\\-driven transport practice, working with clients including Heathrow Airport, National Transport Authority Ireland, Transport for London, and Department for Transport.\n   \n\n  \n\n We work with large, complex datasets (often billion\\+ records) including GPS tracking data and Mobile Network Data to analyze vehicle and people movement patterns across highway and sustainable transport modes.\n   \n\n  \n\n Key work areas include\n   \n\n  \n\n* Trend analysis, clustering, data fusion, and engineering\n* Advanced transport model inputs\n* Predictive modeling using Machine Learning\n* Predictive Discrete choice modeling\n\n\n We are open to flexible working arrangements and have successfully embedded hybrid working into our delivery style. With a network of offices nationally, we are open to candidates from all locations. So if you have been wondering what to do next with your career and how to make change happen, do reach out to Jacobs!\n   \n\n  \n\n We value collaboration and believe that in\\-person interactions are crucial for both our culture and client delivery. We empower employees with our hybrid working policy, allowing them to split their work week between Jacobs offices\/projects and remote locations enabling them to deliver their best work.\n   \n\n  \n\n Here's what you'll need\n   \n\n  \n\n We're seeking an experienced Transport Data Scientist for challenging, high\\-profile transport projects. The role offers significant growth opportunities and independence, typically reporting to senior technic oup Risk Management) is tasked with overseeing, assessing, and managing the model risk that may arise from these AI capabilities.\n   \n\n  \n\n The AI validation team uses machine learning, statistical, and computational strategies to assess model risk. In doing so, RBC is able to identify model weaknesses early and enhance the reliability of production models across all lines of business.\n   \n\n  \n\n**What will you do?**\n* Application: You will have the opportunity to work in any of the many areas we work in, across an even wider variety of business functions.\n* Validation: Your role is to challenge models and identify risks associated with their use \u2013 both conceptually and empirically. To that end, you will design and execute validation frameworks, exploring modelling considerations such as conceptual soundness, data processing, metric reproducibility \\& stability, benchmarking, robustness, uncertainty quantification, fairness, privacy, explainability, implementation controls and more. You will also have the freedom to explore ideas that interest you and build your own models and tools.\n* Research \\& Development: You will read research papers (established work and state\\-of\\-the\\-art) to enhance how our team validates models and contribute to our knowledge pool. You are encouraged to apply what you\u2019ve learned to real\\-world problems, develop reusable software packages, and share your insights with others.\n* IT: You will collaborate with cross\\-functional stakeholders to establish and promote best\\-practices related to MLOps, tooling and IT infrastructure.\n* Governance: You will work with model developers (data scientists, researchers, engineers) and business stakeholders to inventory applications of AI and machine learning at the bank, determine their materiality, and assess whether they require review.\n\n\n As a Senior Data Scientist, your technical expertise will enable you to be effective in a team environment and when working independently.\n   \n\n  \n\n**What do you need to succeed?**\n**Must\\-have**\n* Passionate about learning and staying up\\-to\\-date with research and technology\n* Strong communication and interpersonal skills\n* Progress towards a PhD or Master\u2019s degree in Statistics, Computer Science, Applied Mathematics, Econometrics, Engineering, Quantitative Finance, or a related quantitative field\n* 3\\+ years programming skills experience in Python or a similar language; you should already be comfortable with writing research experiments and be willing to learn how to write clean code.\n* Familiarity with popular machine learning frameworks and libraries\n\n\n**Nice\\-to\\-have**\n* A risk\\-oriented mindset: You are curious about the \u201chow\u201d as well as the \u201cwhy\"\n* Publication or prior research experience (applied or fundamental)\n* Experience with version control systems\n* Comfortable with command line tools\n\n\n**What\u2019s in it for you?**\n As a team, we thrive on the challenge to be our best, encourage progressive thinking for continued growth, and collaborate with one another to deliver trusted advice to help our clients thrive and our communities prosper. We respect and care about all of our team members and support one another in reaching our fullest potential. We work together to make a difference in our communities and to achieve success that is mutual.\n   \n\n  \n\n This opportunity will provide you with:\n   \n\n  \n\n* Leaders who support your development through coaching and managing opportunities\n* Flexibility to work on projects that you are passionate about\n* Ability to make a difference and lasting impact\n* Work in a dynamic, collaborative, progressive, and high\\-performing team\n* Opportunities to do challenging work and make a difference\n* Opportunities to build close relationships\n\n\n**Job Skills**\n Client Counseling, Competitive Markets, Critical Thinking, Financial Instruments, Financial Regulation, Investment Risk Management, Long Term Planning, Quantitative Methods, Risk Management\n   \n\n  \n\n**Additional Job Details**\n**Address:**\n ROYAL BANK PLAZA, 200 BAY ST:TORONTO\n   \n\n  \n\n**City:**\n TORONTO\n   \n\n  \n\n**Country:**\n Canada\n   \n\n  \n\n**Work hours\/week:**\n 37\\.5\n   \n\n  \n\n**Employment Type:**\n Full time\n   \n\n  \n\n**Platform:**\n GROUP RISK MANAGEMENT\n   \n\n  \n\n**Job Type:**\n Regular\n   \n\n  \n\n**Pay Type:**\n Salaried\n   \n\n  \n\n**Posted Date:**\n 2025\\-07\\-02\n   \n\n  \n\n**Application Deadline:**\n 2025\\-07\\-17\n   \n\n  \n\n**Note** \n**:** \n*Applications will be accepted until 11:59 PM on the day prior to the application deadline date above*\n**I** \n****nclusion** \n and Equal Opportunity Employment**\n At RBC, we believe an inclusive workplace that has diverse perspectives is core to our continued growth as one of the largest and most successful banks in the world. Maintaining a workplace where our employees feel supported to perform at their best, effectively collaborate, drive innovation, and grow professionally helps to bring our Purpose to life and create value for our clients and communities. RBC strives to deliver this through policies and programs intended to foster a workplace based on respect, belonging and opportunity for all.\n   \n\n  \n\n**Join our Talent Community**\n Stay in\\-the\\-know about great career opportunities at RBC. Sign up and get customized info on our latest jobs, career tips and Recruitment events that matter to you.\n   \n\n  \n\n Expand your limits and create a new future together at RBC. Find out how we use our passion and drive to enhance the well\\-being of our clients and communities at jobs.rbc.com\\<\/a\/span\\>","company_industry":"Banking and Financial Services","company_url":"https:\/\/ca.linkedin.com\/company\/rbc","company_logo":"https:\/\/media.licdn.com\/dms\/image\/v2\/D560BAQFGyRvMVMYqAw\/company-logo_100_100\/company-logo_100_100\/0\/1719806995661?e=2147483647&v=beta&t=MFl5gAhOq  \n\n As a Principal Data Scientist on our Platform Strategy and Emerging Technologies (PSET) \\- Programs \\& Business Excellence (PBE) team, you will play a key role in advancing the data science and AI capabilities within the company. You will serve as a subject matter expert, guiding the development and deployment of machine learning models and data driven solutions that support strategic platform capabilities. In this role, you will partner with cross\\-functional teams \u2013 including data scientists, data analysts, product managers, engineers and domain experts to deliver innovative solutions that drive business impact. This role requires a combination of strong technical expertise, leadership abilities, and business acumen to address complex challenges and influence strategic decisions. You will report to the Senior Manager of Data Science, PSET.\n   \n\n  \n\n Preference for candidates to work hybrid\/remote in Toronto or Montreal, Canada.\n   \n\n  \n\n**Responsibilities**\n* Collaborate with Product, Engineering, and Business leaders to translate complex business challenges into testable hypotheses and impactful data science solutions\n* Develop \\& deploy end\\-to\\-end AI\/ML pipelines, by partnering with data engineers and contribute from data preprocessing to model training, validation, deployment, and monitoring\n* Design and implement advanced statistical \\& experimentation frameworks, including post\\-launch causal inference techniques (e.g. A\/B testing, propensity score matching) to measure product impact\n* Lead the exploration and application of Generative AI to develop scalable solutions \\- such as AI assistants to support platform capabilities\n* Build classic machine learning applications such as personalization, recommendation, and ranking systems to improve customer workflows and drive product adoption\n* Mentor and guide junior data scientists, conduct technical reviews, and promote best practices in experimentation, model development, and MLOps\n* Collaborate with a team of data scientists in developing AI\/ML models and solutions over large\\-scale data that address business problems and drive product innovation\n* Translate insights into actionable recommendations, effectively guiding business strategy through clear communication with cross\\-functional teams\n* Advanced expert role, requiring deep subject\\-matter knowledge and sound business acumen to advise leaders\n* For jobs at this level, knowledge of the business starts to become as important as subject\\-matter knowledge\n* Incumbents translate specialized subject\\-matter requirements into business needs\/requirements\n* Require depth of specialized expertise to interpret internal\/external business issues and recommend best practices to address them\n* Solve complex problems that require in\\-depth evaluation of variable factors by taking a broad perspective to identify the best approach and innovative solutions.\n* Work independently, with close guidance in only the most complex or unusual situations\n* Adapt communication style to persuade various stakeholders across the business and frequently interact with senior leaders to provide advice and SME\n* May lead functional teams or programs within own function (or closely related functions)\n\n\n**Minimum Qualifications**\n* Bachelor's or master's degree (preferred) in Computer Science, Data Science, Machine Learning, Artificial Intelligence, or related field, or equivalent work experience\n* 8\\+ years of experience in data science, machine learning, or AI, with a proven track record of delivering successful AI\\-driven solutions at scale\n* Expertise in developing and deploying machine learning models, particularly in large\\-scale environments, with a focus on deep learning, reinforcement learning, or natural language processing\n* Proficient with various statistical and machine learning techniques including classification, regression, dimension reduction, regularization, clustering and various multivariate methods\n* Hands of experience with design and analysis of A\/B and multivariate experiments to measure the impact of product changes and business strategies with statistical rigor\n* Strong proficiency in programming languages such as Python, with experience in using machine learning libraries such as, PyTorch \\& associated libraries for AI\/ML\n* Experience working with cloud environments like AWS and leveraging its offerings such as Lambda Bedrock, SageMaker, etc\n* Hands\\-on expertise in AI and LLM development with Finetuning expertise in a real\\-world business environment\n* Excellent communication skills, with the ability to present complex technical concepts to non\\-technical stakeholders\n\n\n**Preferred Qualifications**\n* Strong publication record in top\\-tier AI\/ML conferences and journals\n* Experience deploying AI models for real\\-time applications in manufacturing or construction\n* Strong knowledge base of MLOps practices for efficient model deployment and scaling\n* Proven leadership and mentorship experience, with a passion for developing and inspiring high\\-performing teams\n\n\n**25WD89433, Data Scientist principal**\n**Aper\u00e7u du poste**\n Les clients d'Autodesk donnent du sens au monde gr\u00e2ce \u00e0 de riches flux de donn\u00e9es, allant des scans 3D de b\u00e2timents et des simulations de dynamique des fluides aux notes prises sur les chantiers et aux tendances d'utilisation des produits. Nous recherchons un scientifique principal des donn\u00e9es pour rejoindre l'\u00e9quipe PSET (Platform Strategy and Emerging Technologies) d'Autodesk et mettre \u00e0 profit son exp\u00e9rience en IA\/ML et en science des donn\u00e9es pour d\u00e9velopper la prochaine g\u00e9n\u00e9ration de solutions d'IA appliqu\u00e9es qui alimentent notre plateforme et offrent \u00e0 nos clients des exp\u00e9riences plus intelligentes, \u00e9volutives et rentables.\n   \n\n  \n\n En tant que scientifique principal des donn\u00e9es au sein de notre \u00e9quipe PSET (Platform Strategy and Emerging Technologies) \\- PBE (Programs \\& Business Excellence), vous jouerez un r\u00f4le cl\u00e9 dans l'am\u00e9lioration des capacit\u00e9s de l'entreprise en mati\u00e8re de science des donn\u00e9es et d'IA. Vous serez un expert en la mati\u00e8re et guiderez le d\u00e9veloppement et le d\u00e9ploiement de mod\u00e8les d'apprentissage automatique et de solutions bas\u00e9es sur les donn\u00e9es qui soutiennent les capacit\u00e9s strat\u00e9giques de la plateforme. \u00c0 ce poste, vous travaillerez en collaboration avec des \u00e9quipes interfonctionnelles, notamment des scientifiques des donn\u00e9es, des analystes de donn\u00e9es, des chefs de produit, des ing\u00e9nieurs et des experts du domaine, afin de fournir des solutions innovantes qui ont un impact sur l'activit\u00e9. Ce poste n\u00e9cessite une solide expertise technique, des capacit\u00e9s de leadership et un sens aigu des affaires afin de relever des d\u00e9fis complexes et d'influencer les d\u00e9cisions strat\u00e9giques. Vous serez rattach\u00e9 au directeur principal de la science des donn\u00e9es, PSET.\n   \n\n  \n\n La pr\u00e9f\u00e9rence sera donn\u00e9e aux candidats pouvant travailler en mode hybride\/\u00e0 distance \u00e0 Toronto ou \u00e0 Montr\u00e9al, au Canada.\n   \n\n  \n\n**Responsabilit\u00e9s**\n* Collaborer avec les responsables des produits, de l'ing\u00e9nierie et des activit\u00e9s commerciales afin de traduire des d\u00e9fis commerciaux complexes en hypoth\u00e8ses testables et en solutions de science des donn\u00e9es efficaces.\n* D\u00e9velopper et d\u00e9ployer des pipelines IA\/ML de bout en bout, en partenariat avec des ing\u00e9nieurs de donn\u00e9es, et contribuer au pr\u00e9\\-traitement des donn\u00e9es, \u00e0 la formation, \u00e0 la validation, au d\u00e9ploiement et \u00e0 la surveillance des mod\u00e8les.\n* Concevoir et mettre en \u0153uvre des cadres statistiques et exp\u00e9rimentaux avanc\u00e9s, y compris des techniques d'inf\u00e9rence causale post\\-lancement (par exemple, tests A\/B, appariement par score de propension) pour mesurer l'impact des produits\n* Diriger l'exploration et l'application de l'IA g\u00e9n\u00e9rative afin de d\u00e9velopper des solutions \u00e9volutives, telles que des assistants IA pour soutenir les capacit\u00e9s de la plateforme\n* Construire des applications classiques d'apprentissage automatique telles que des syst\u00e8mes de personnalisation, de recommandation et de classement afin d'am\u00e9liorer les flux de travail des clients et de favoriser l'adoption des produits\n* Encadrer et guider les data scientists juniors, mener des revues techniques et promouvoir les meilleures pratiques en mati\u00e8re d'exp\u00e9rimentation, de d\u00e9veloppement de mod\u00e8les et de MLOps\n* Collaborer avec une \u00e9quipe de data scientists pour d\u00e9velopper des mod\u00e8les et des solutions d'IA\/ML sur des donn\u00e9es \u00e0 grande \u00e9chelle qui r\u00e9pondent aux probl\u00e8mes commerciaux et stimulent l'innovation produit\n* Traduire les insights en recommandations exploitables, en guidant efficacement la strat\u00e9gie commerciale gr\u00e2ce \u00e0 une communication claire avec les \u00e9quipes interfonctionnelles\n* R\u00f4le d'expert avanc\u00e9, n\u00e9cessitant une connaissance approfondie du sujet et un sens aigu des affaires pour conseiller les dirigeants\n* Pour les postes de ce niveau, la connaissance de l'entreprise commence \u00e0 devenir aussi importante que la connaissance du sujet\n* Les titulaires traduisent les exigences techniques sp\u00e9cialis\u00e9es en besoins\/exigences commerciaux\n* N\u00e9cessite une expertise sp\u00e9cialis\u00e9e approfondie pour interpr\u00e9ter les probl\u00e8mes commerciaux internes\/externes et recommander les meilleures pratiques pour y rem\u00e9dier\n* R\u00e9soudre des probl\u00e8mes complexes qui n\u00e9cessitent une \u00e9valuation approfondie de facteurs variables en adoptant une perspective large afin d'identifier la meilleure approche et des solutions innovantes\n* Travailler de mani\u00e8re autonome, avec un encadrement \u00e9troit uniquement dans les situations les plus complexes ou inhabituelles\n* Adapter son style de communication pour persuader les diff\u00e9rentes parties prenantes de l'entreprise et interagir fr\u00e9quemment avec les cadres sup\u00e9rieurs afin de leur fournir des conseils et une expertise\n* Peut diriger des \u00e9quipes fonctionnelles ou des programmes au sein de sa propre fonction (ou de fonctions \u00e9troitement li\u00e9es)\n\n\n**Qualifications Minimales**\n* Licence ou master (de pr\u00e9f\u00e9rence) en informatique, science des donn\u00e9es, apprentissage automatique, intelligence artificielle ou dans un domaine connexe, ou exp\u00e9rience professionnelle \u00e9quivalente\n* Plus de 8 ans d'exp\u00e9rience en science des donn\u00e9es, apprentissage automatique ou IA, avec une exp\u00e9rience av\u00e9r\u00e9e dans la mise en \u0153uvre \u00e0 grande \u00e9chelle de solutions bas\u00e9es sur l'IA\n* Expertise dans le d\u00e9veloppement et le d\u00e9ploiement de mod\u00e8les d'apprentissage automatique, en particulier dans des environnements \u00e0 grande \u00e9chelle, avec un accent sur l'apprentissage profond, l'apprentissage par renforcement ou le traitement du langage naturel\n* Ma\u00eetrise de diverses techniques statistiques et d'apprentissage automatique, notamment la classification, la r\u00e9gression, la r\u00e9duction de dimension, la r\u00e9gularisation, le clustering et diverses m\u00e9thodes multivari\u00e9es\n* Exp\u00e9rience pratique de la conception et de l'analyse d'exp\u00e9riences A\/B et multivari\u00e9es pour mesurer l'impact des changements de produits et des strat\u00e9gies commerciales avec une rigueur statistique\n* Ma\u00eetrise des langages de programmation tels que Python, avec une exp\u00e9rience de l'utilisation de biblioth\u00e8ques d'apprentissage automatique telle uture? Join us!\n   \n\n  \n\n Bienvenue \u00e0 Autodesk ! Des choses incroyables sont cr\u00e9\u00e9es chaque jour avec nos logiciels \\- des b\u00e2timents les plus \u00e9cologiques et des voitures les plus propres aux usines les plus intelligentes et aux plus grands films \u00e0 succ\u00e8s. Nous aidons les innovateurs \u00e0 transformer leurs id\u00e9es en r\u00e9alit\u00e9, transformant non seulement la fa\u00e7on dont les choses sont faites, mais ce qui peut \u00eatre fait.\n   \n\n  \n\n Nous sommes tr\u00e8s fiers de notre culture ici chez Autodesk \\- notre code en mati\u00e8re de culture est au c\u0153ur de tout ce que nous faisons. Nos valeurs et nos m\u00e9thodes de travail aident nos employ\u00e9s \u00e0 prosp\u00e9rer et \u00e0 r\u00e9aliser leur potentiel, ce qui conduit \u00e0 des r\u00e9sultats encore meilleurs pour nos clients.\n   \n\n  \n\n Lorsque vous \u00eates un employ\u00e9 Autodesk, vous pouvez \u00eatre entier et authentique et effectuer un travail significatif qui aide \u00e0 construire un avenir meilleur pour tous. Pr\u00eat \u00e0 fa\u00e7onner le monde et votre avenir? Joignez\\-vous \u00e0 nous !\n   \n\n  \n\n**Salary transparency \/ Transparence salariale**\n Salary is one part of Autodesk\u2019s competitive compensation package. Offers are based on the candidate\u2019s experience and geographic location. In addition to base salaries, we also have a significant emphasis on discretionary annual cash bonuses, commissions for sales roles, stock or long\\-term incentive cash grants, and a comprehensive benefits package.\n   \n\n  \n\n Le salaire est l'un des \u00e9l\u00e9ments de l'offre comp\u00e9titive d'Autodesk. Les offres sont bas\u00e9es sur l'exp\u00e9rience et la situation g\u00e9ographique du candidat. Outre les salaires de base, nous accordons \u00e9galement une grande importance aux primes annuelles discr\u00e9tionnaires en esp\u00e8ces, aux commissions pour les fonctions de vente, aux actions ou aux primes d'encouragement \u                     else { tr.removeClass('viewed'); delete viewedJobs[jobId]; }
                    localStorage.setItem('viewedJobs', JSON.stringify(viewedJobs));
                });
                $('#reset-filters').on('click', function() {
                    table.columns().search('').draw();
                    $('tfoot .select2').val(null).trigger('change');
                    $('tfoot input').val('');
                });
            });
        </script>
    </body></html>
